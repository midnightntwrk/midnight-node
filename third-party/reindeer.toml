# Reindeer config — read from <third-party-dir>/reindeer.toml because buckify
# is invoked as `reindeer --third-party-dir third-party buckify`.
#
# Fixups are vendored in third-party/fixups/ — authored for this repo, under
# its Apache-2.0 header. No external/shared fixup source: the graph is
# self-contained and reviewable in-tree.

# Default Cargo env vars for every crate that has no crate-specific `cargo_env`
# fixup. Cargo sets these at compile time; without them, codec/serde derives
# (via proc-macro-crate, which reads $CARGO_MANIFEST_DIR/Cargo.toml) and any
# env!("CARGO_PKG_*") fail. This is the wide polkadot-sdk slice's baseline —
# saves a per-crate fixup for every FRAME/sp-* crate that derives Encode/Decode.
cargo_env = [
    "CARGO_MANIFEST_DIR",
    "CARGO_PKG_NAME",
    "CARGO_PKG_VERSION",
    "CARGO_PKG_VERSION_MAJOR",
    "CARGO_PKG_VERSION_MINOR",
    "CARGO_PKG_VERSION_PATCH",
    "CARGO_PKG_VERSION_PRE",
    "CARGO_PKG_AUTHORS",
    "CARGO_PKG_DESCRIPTION",
    "CARGO_PKG_REPOSITORY",
    "CARGO_PKG_HOMEPAGE",
    "CARGO_PKG_README",
    "CARGO_PKG_RUST_VERSION",
    "CARGO_BIN_NAME",
    "CARGO_CRATE_NAME",
]

# Non-vendored: sources fetched via http_archive/git_fetch rules. Vendoring is
# impossible for this graph — sp-crypto-hashing 0.1.0 exists from both
# crates.io (via midnight-ledger) and the polkadot-sdk git tag, which
# `cargo vendor` rejects as duplicates.
vendor = false
