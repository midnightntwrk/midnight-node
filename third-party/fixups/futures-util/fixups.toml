# no_std wasm32: std feature requires extern crate std which does not exist on
# wasm32v1-none. The io and channel sub-modules in futures-util are doubly gated
# on both `feature = "io"` and `feature = "std"` (verified in lib.rs), so omitting
# std suppresses all std::io usage even while those feature flags remain set.
['cfg(target_arch = "wasm32")']
omit_features = ["std"]
