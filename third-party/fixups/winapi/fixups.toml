# Windows-only crate. Midnight only buckifies for macOS/Linux, so mark it
# incompatible with non-Windows platforms — `buck2 //...` then skips it cleanly
# instead of failing the compatibility check on its transitive Windows `.lib`
# deps. This local fixup intentionally overrides the shared buck2-fixups entry
# (its Windows link libs are irrelevant here since the crate never builds).
target_compatible_with = ["config//os:windows"]
buildscript.run = false
