# The crate ships `readme.md` with no `readme` key, so cargo's README autodetect
# finds it on a case-insensitive filesystem (macOS) and not on Linux: buckified
# on a Mac, CARGO_PKG_README is "README.md"; on Linux, "". Nothing reads it, so
# drop it from the env and the graph regenerates identically on both.
cargo_env = [
    "CARGO_MANIFEST_DIR",
    "CARGO_PKG_NAME",
    "CARGO_PKG_VERSION",
    "CARGO_PKG_VERSION_MAJOR",
    "CARGO_PKG_VERSION_MINOR",
    "CARGO_PKG_VERSION_PATCH",
    "CARGO_PKG_VERSION_PRE",
    "CARGO_PKG_AUTHORS",
    "CARGO_PKG_DESCRIPTION",
    "CARGO_PKG_REPOSITORY",
    "CARGO_PKG_HOMEPAGE",
    "CARGO_PKG_RUST_VERSION",
    "CARGO_BIN_NAME",
    "CARGO_CRATE_NAME",
]
