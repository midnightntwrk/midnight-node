# openssl-0.10's build script reads DEP_OPENSSL_VERSION_NUMBER and DEP_OPENSSL_CONF
# (emitted by openssl-sys's `links = "openssl"` build script) to decide which
# version cfgs and osslconf= flags to emit. With the `vendored` feature active
# (str0m-openssl-0.6 requests it), openssl-sys builds OpenSSL from source via
# openssl-src 300.6.1+3.6.3 = OpenSSL 3.6.3, regardless of the system libssl.
#
# openssl-src is configured with features = ["default", "legacy"], which means
# no-camellia, no-idea, no-seed, and no-ssl3-method are all passed to ./Configure.
# The resulting opensslconf.h defines OPENSSL_NO_CAMELLIA, OPENSSL_NO_IDEA,
# OPENSSL_NO_SEED, OPENSSL_NO_SSL3_METHOD. These must all appear in DEP_OPENSSL_CONF
# or openssl-0.10 includes the EVP_camellia_* / EVP_seed_* wrappers that reference
# symbols the ffi omits -> E0425.
#
# DEP_OPENSSL_VERSION_NUMBER for OpenSSL 3.6.3: (3<<28)|(6<<20)|(3<<4) = 0x30600030.
cargo_env = true

['cfg(target_os = "linux")'.buildscript.run.env]
DEP_OPENSSL_VERSION_NUMBER = "30600030"
# This env block REPLACES reindeer's baked DEP_OPENSSL_* rather than merging, so
# all NO_* flags that the vendored ./Configure emits must be listed here.
DEP_OPENSSL_CONF = "OPENSSL_NO_CAMELLIA,OPENSSL_NO_IDEA,OPENSSL_NO_SEED,OPENSSL_NO_SSL3_METHOD"
