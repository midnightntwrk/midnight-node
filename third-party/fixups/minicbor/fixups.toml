# Only minicbor 0.25.x carries a build.rs; 2.2.x (incl. the wasm universe's
# 2.2) has none. Gate the directive to 0.25.x so it is not flagged unused where
# the resolved version has no build script.
['cfg(version = ">=0.25, <0.26")']
buildscript.run = false
