# Non-.rs data file (include_bytes!) mapped as a crate sub-target src: buck2
# prunes all but the .rs closure from a whole-crate src on remote workers, so
# the file would otherwise vanish. Key = path inside the published .crate
# (crate root after strip_prefix), value = dest under CARGO_MANIFEST_DIR.
[extra_mapped_srcs]
"static/bls_midnight_2p14" = "static/bls_midnight_2p14"
