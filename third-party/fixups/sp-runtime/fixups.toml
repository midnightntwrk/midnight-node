# Polkadot SDK: parity-scale-codec Encode/Decode derive needs CARGO_MANIFEST_DIR
# (via proc-macro-crate); supplied by cargo_env.
cargo_env = true
# git deps' include_str! files can't go through extra_srcs (reindeer globs local
# project files; git sources are fetched at buck build time). Reference them as
# git-tree sub-targets via extra_mapped_srcs (key = path within the git repo,
# value = path within the crate's materialised __srcs).
[extra_mapped_srcs]
"substrate/primitives/runtime/docs/mermaid/extrinsics.mmd" = "docs/mermaid/extrinsics.mmd"
