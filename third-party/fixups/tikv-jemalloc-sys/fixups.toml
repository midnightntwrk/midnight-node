# The build script compiles the vendored jemalloc (configure && make) and emits
# the link directives for libjemalloc.a; without it mallocx and friends are
# undefined at link. It reads NUM_JOBS with expect_env, which only cargo sets:
# the value bounds make's parallelism and does not reach the output. CC/CXX name
# the clang buck2/Earthfile installs, as for aws-lc-sys.
cargo_env = true

[buildscript.run.env]
OPT_LEVEL = "3"
NUM_JOBS = "4"
CC = "/usr/bin/clang"
CXX = "/usr/bin/clang++"
