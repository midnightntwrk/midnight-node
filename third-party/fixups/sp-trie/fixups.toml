# Polkadot SDK: parity-scale-codec Encode/Decode derive needs CARGO_MANIFEST_DIR
# (via proc-macro-crate); supplied by cargo_env.
cargo_env = true

# include_str!/include_bytes!/mermaid! of non-.rs files from the git tree —
# referenced as git sub-target srcs so remote workers materialise them
# (extra_srcs can't: it globs local files, git deps are fetched at build).
[extra_mapped_srcs]
"substrate/primitives/trie/test-res/invalid-delta-order" = "test-res/invalid-delta-order"
"substrate/primitives/trie/test-res/proof" = "test-res/proof"
"substrate/primitives/trie/test-res/storage_root" = "test-res/storage_root"
"substrate/primitives/trie/test-res/valid-delta-order" = "test-res/valid-delta-order"
