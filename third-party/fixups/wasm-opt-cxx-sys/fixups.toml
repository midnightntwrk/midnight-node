cargo_env = true

# Emits rustc-link-*; explicit so no reindeer default is relied on.
[buildscript.run]
rustc_link_lib = true
rustc_link_search = true

# cc-rs needs OPT_LEVEL to compile the cxxbridge glue
[buildscript.run.env]
OPT_LEVEL = "3"
