# no_std wasm32: std feature requires extern crate std which does not exist on
# wasm32v1-none. futures-executor with std removed compiles as no_std (empty
# surface - block_on/LocalPool/ThreadPool are all std-only) but the dep chain
# from sp-inherents still resolves futures-executor into the wasm graph.
['cfg(target_arch = "wasm32")']
omit_features = ["std"]
