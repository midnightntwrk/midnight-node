# kics-scan disable=610e266e-6c12-4bca-9925-1ed0cd29742b,698ed579-b239-4f8f-a388-baa4bcb13ef8,ce76b7d0-9e77-464d-b86f-c5c48e03e22d
# This file should NOT be run directly. It exists solely so that Dependabot
# can detect and update the pinned image dependencies used by tests.
services:
  guard:
    image: busybox
    command: "false"
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:15@sha256:5f07e69ced9ee30ec814cd12c555694276bb1d520e971205f39a833362748a3c}
    depends_on:
      guard:
        condition: service_completed_successfully
  midnight-node:
    image: ${NODE_IMAGE:-midnightntwrk/midnight-node:latest-main}
    depends_on:
      guard:
        condition: service_completed_successfully
  indexer-standalone:
    image: ${INDEXER_STANDALONE_IMAGE:-ghcr.io/midnight-ntwrk/indexer-standalone:4.4.0-rc.6-68702121}
    depends_on:
      guard:
        condition: service_completed_successfully

  # Node for the indexer e2e: the exact node build the pinned indexer was generated against (its
  # `NODE_VERSIONS`), not `midnight-node` (CI's fresh build). The indexer rejects node versions it
  # doesn't map, and same-spec builds with other metadata crash it at genesis.
  midnight-node-indexer-e2e:
    image: ${INDEXER_E2E_NODE_IMAGE:-midnightntwrk/midnight-node:2.1.0-rc.4}
    depends_on:
      guard:
        condition: service_completed_successfully

  # Ledger-8 release: the hardfork_e2e test forks from this (ledger 8, runtime
  # spec_version 1_000_000, pallet-midnight storage version 1) up to the current
  # ledger-9 runtime, exercising the v8->v9 state migration.
  midnight-node-fork-from:
    image: ${FORK_FROM_NODE_IMAGE:-midnightntwrk/midnight-node:1.0.1}
    depends_on:
      guard:
        condition: service_completed_successfully
