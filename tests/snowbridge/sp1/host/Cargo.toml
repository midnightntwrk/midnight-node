[package]
name = "midnight-sp1-prover"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
midnight-beefy = { path = "../beefy" }
sp1-sdk = { version = "=6.10.0", default-features = false, features = ["native-gnark"] }
parity-scale-codec = "=3.7.5"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
hex = "0.4"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[build-dependencies]
sp1-build = "=6.10.0"
