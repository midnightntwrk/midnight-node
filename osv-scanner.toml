# Not in deny.toml: cargo-deny only checks crates.io packages, and this one is
# the [patch.crates-io] git fork. osv-scanner matches on name and version, so
# it reads yamux 0.12.2 as upstream's vulnerable release.
[[IgnoredVulns]]
id = "GHSA-vxx9-2994-q338"
reason = "yamux 0.12.2 is patched to midnightntwrk/rust-yamux (branch yamux-v0.12.2, 8ed778c backports the fix); node/tests/yamux_vulnerability.rs covers it. The 0.13.10 also in the lockfile is a fixed release."

# Advisories that do not reach the node: crates only in the lockfile, or code
# behind a feature the build does not enable. Not mirrored in deny.toml yet:
# add them there too if cargo-deny reports them. Re-check each on its review
# date; a polkadot-sdk bump can change either answer.
[[IgnoredVulns]]
id = "RUSTSEC-2026-0505"
ignoreUntil = 2027-02-26
reason = "hickory-proto: DNSSEC validation flaw; hickory 0.24 is built (libp2p-dns, libp2p-mdns) with features mdns, socket2, tokio only, so no DNSSEC validation is compiled. Fixed only in 0.26, which needs libp2p >= 0.56 (not in polkadot-sdk stable2611)"

