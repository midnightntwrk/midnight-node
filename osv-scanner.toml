# osv-scanner config for the root Cargo.lock, read by the scan workflow
# (midnightntwrk/upload-sarif-github-action).

# Advisory excuses: a copy of deny.toml's [advisories] ignore list (cargo-deny,
# run by the Earthfile's +audit-rust). Keep the two in sync: one waiver per
# advisory, in both files, so cargo-deny and osv-scanner agree.
[[IgnoredVulns]]
id = "RUSTSEC-2023-0091"
reason = "vuln in old wasmtime version used by polkadot-sdk"

[[IgnoredVulns]]
id = "RUSTSEC-2024-0438"
reason = "vuln in old wasmtime version used by polkadot-sdk"

[[IgnoredVulns]]
id = "RUSTSEC-2024-0442"
reason = "vuln in old wasmtime version used by polkadot-sdk"

[[IgnoredVulns]]
id = "RUSTSEC-2025-0012"
reason = "backoff is unmaintained but no replacement is available"

# Not in deny.toml: cargo-deny only checks crates.io packages, and this one is
# the [patch.crates-io] git fork. osv-scanner matches on name and version, so
# it reads yamux 0.12.2 as upstream's vulnerable release.
[[IgnoredVulns]]
id = "GHSA-vxx9-2994-q338"
reason = "yamux 0.12.2 is patched to midnightntwrk/rust-yamux (branch yamux-v0.12.2, 8ed778c backports the fix); node/tests/yamux_vulnerability.rs covers it. The 0.13.10 also in the lockfile is a fixed release."

# Licence excuses: GPL-3.0-only polkadot-sdk crates that reach the lockfile
# only through frame-benchmarking-cli (-> cumulus), an optional dependency of
# node behind the `runtime-benchmarks` feature. The released node and runtime
# are built without it; only +build-benchmarks, an internal artifact, links
# them. Matched by name, not version, so a polkadot-sdk bump does not re-raise
# them. Re-check before relying on this:
#
#   cargo tree --workspace --target all -e normal,build -i polkadot-primitives
#
# must find nothing; once it does, these crates ship and the excuses are wrong.

[[PackageOverrides]]
name = "polkadot-core-primitives"
ecosystem = "crates.io"
license.ignore = true
reason = "runtime-benchmarks only, via frame-benchmarking-cli; not in the released node or runtime"

