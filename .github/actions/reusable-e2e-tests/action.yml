name: "Reusable E2E Test"
description: "Runs a specific E2E test using JUST and GHCR images"
inputs:
  just-command:
    description: "The JUST command to run"
    required: true
  node-image:
    description: "The full node image name (with tag)"
    required: false
  toolkit-image:
    description: "Optional: the toolkit image (if needed)"
    required: false
  ghcr-password:
    description: "Password for Docker login to GHCR"
    required: true
runs:
  using: "composite"
  steps:
    - name: Install just
      uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe  # v2.87.27
      with:
        tool: just

    - name: Docker Login
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: MidnightCI
        password: ${{ inputs.ghcr-password }}

    - name: Run JUST command
      env:
        JUST_COMMAND: ${{ inputs.just-command }}
        NODE_IMAGE: ${{ inputs.node-image }}
        TOOLKIT_IMAGE: ${{ inputs.toolkit-image }}
      run: |
        echo "🧪 Running E2E command: $JUST_COMMAND"

        case "$JUST_COMMAND" in
          indexer-api-e2e)
            just "$JUST_COMMAND"
            ;;
          startup-dev-e2e | startup-qanet-e2e)
            just "$JUST_COMMAND" "$NODE_IMAGE"
            ;;
          toolkit-e2e | toolkit-update-ledger-parameters-e2e | toolkit-maintenance-e2e | toolkit-mint-e2e | toolkit-tokens-minter-e2e | toolkit-contracts-e2e | genesis-wallets-undeployed-e2e | genesis-wallets-devnet-e2e)
            just "$JUST_COMMAND" "$NODE_IMAGE" "$TOOLKIT_IMAGE"
            ;;
          *)
            just "$JUST_COMMAND" "$NODE_IMAGE"
            ;;
        esac
      shell: bash
