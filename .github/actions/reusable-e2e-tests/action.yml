name: "Reusable E2E Test"
description: "Runs a specific E2E test using JUST and GHCR images"
inputs:
  just-command:
    description: "The JUST command to run"
    required: true
  node-image:
    description: "The full node image name (with tag)"
    required: false
  toolkit-image:
    description: "Optional: the toolkit image (if needed)"
    required: false
  ghcr-password:
    description: "Password for Docker login to GHCR (empty on fork PRs: login is skipped)"
    required: false
    default: ""
  images-artifact:
    description: "Fork PRs: artifact holding the images, loaded instead of pulling from GHCR"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Install just
      uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39  # v2.90.3
      with:
        tool: just

    - name: Docker Login
      if: inputs.ghcr-password != ''
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ghcr.io
        username: MidnightCI
        password: ${{ inputs.ghcr-password }}

    - name: Load images
      if: inputs.images-artifact != ''
      uses: ./.github/actions/load-fork-images # zizmor: ignore[self-repository] actionlint does not yet accept $/
      with:
        artifact-pattern: ${{ inputs.images-artifact }}

    - name: Run JUST command
      env:
        JUST_COMMAND: ${{ inputs.just-command }}
        NODE_IMAGE: ${{ inputs.node-image }}
        TOOLKIT_IMAGE: ${{ inputs.toolkit-image }}
      run: |
        echo "🧪 Running E2E command: $JUST_COMMAND"

        case "$JUST_COMMAND" in
          indexer-api-e2e)
            just "$JUST_COMMAND"
            ;;
          startup-dev-e2e | startup-qanet-e2e)
            just "$JUST_COMMAND" "$NODE_IMAGE"
            ;;
          toolkit-e2e | toolkit-update-ledger-parameters-e2e | toolkit-maintenance-e2e | toolkit-mint-e2e | toolkit-tokens-minter-e2e | toolkit-contracts-e2e | genesis-wallets-undeployed-e2e | genesis-wallets-devnet-e2e)
            just "$JUST_COMMAND" "$NODE_IMAGE" "$TOOLKIT_IMAGE"
            ;;
          *)
            just "$JUST_COMMAND" "$NODE_IMAGE"
            ;;
        esac
      shell: bash
