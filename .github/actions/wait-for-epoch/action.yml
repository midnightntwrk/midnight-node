name: 'Wait for epoch'
description: 'Wait for epoch in specified environment'

inputs:
  epoch:
    description: 'Expected epoch'
    required: true
  deployment:
    description: 'Deployment type (docker or kubernetes)'
    required: true
  node:
    description: 'Node name'
    required: true
  environment:
    description: 'Environment (optional for kubernetes)'
    required: false

runs:
  using: "composite"
  steps:
    - name: Wait for epoch
      shell: bash
      env:
        DEPLOYMENT: ${{ inputs.deployment }}
        NODE: ${{ inputs.node }}
        EPOCH: ${{ inputs.epoch }}
        ENVIRONMENT: ${{ inputs.environment }}
      run: |
        if [ "$DEPLOYMENT" == "docker" ]; then
          epoch=$(docker exec "$NODE" cardano-cli latest query tip --testnet-magic 42 | jq -r .epoch)
          while [ "$epoch" -lt "$EPOCH" ]; do
            echo "Epoch: $epoch"
            sleep 10
            epoch=$(docker exec "$NODE" cardano-cli latest query tip --testnet-magic 42 | jq -r .epoch)
          done
          echo "Epoch: $epoch"

        elif [ "$DEPLOYMENT" == "kubernetes" ]; then
          if [ "$ENVIRONMENT" == "staging-preview" ]; then
            testnet_magic=2
          elif [ "$ENVIRONMENT" == "staging-preprod" ]; then
            testnet_magic=1
          else
            echo "Invalid environment for Kubernetes deployment"
            exit 1
          fi

          epoch=$(kubectl exec "$NODE" -c cardano-node -n "$ENVIRONMENT" -- cardano-cli latest query tip --testnet-magic "$testnet_magic" | jq -r .epoch)
          while [ "$epoch" -lt "$EPOCH" ]; do
            echo "Epoch: $epoch"
            sleep 10
            epoch=$(kubectl exec "$NODE" -c cardano-node -n "$ENVIRONMENT" -- cardano-cli latest query tip --testnet-magic "$testnet_magic" | jq -r .epoch)
          done
          echo "Epoch: $epoch"

        else
          echo "Invalid deployment type"
          exit 1
        fi
