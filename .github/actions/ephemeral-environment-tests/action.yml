name: "Deploy and Test Against Ephemeral Environment"
description: "Deploys a temporary environment and runs end-to-end tests."

inputs:
  sha:
    description: "SHA to checkout"
    required: true
  image:
    description: "Node Image"
    required: true
  tag:
    description: "PC Artifact Tag"
    required: true
  ghcr-password:
    description: "Password for Docker login to GHCR"
    required: true
  aws-role-arn:
    description: "AWS Role ARN to assume"
    required: true
  aws-region:
    description: "AWS Region"
    required: true
  aws-eks-cluster-name:
    description: "EKS Cluster Name"
    required: true
  aws-secret-access-key:
    description: "AWS Secret Access Key"
    required: true
  aws-access-key-id:
    description: "AWS Access Key ID"
    required: true

outputs: {}

runs:
  using: "composite"
  steps:
    - name: Docker Login
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ntwrk-bot
        password: ${{ inputs.ghcr-password }}

    - name: Install Kubectl
      uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e  # v5.2.0

    - name: Deploy ephemeral environment
      run: |
        cd local-env || exit 1
        npm install
        npm run run:qanet
      shell: bash
      env:
        NODE_IMAGE: ${{ inputs.image }}
