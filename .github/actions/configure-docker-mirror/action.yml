name: Configure Docker Hub mirror
description: Merge and reload the hosted Docker mirror without restarting containers
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        f=/etc/docker/daemon.json
        test ! -L "$f"
        test ! -L /etc/docker
        test "$(systemctl show docker.service --property=CanReload --value)" = yes
        sudo mkdir -p /etc/docker
        candidate=$(sudo mktemp /etc/docker/.daemon-mirror-XXXXXX.json)
        trap 'sudo rm -f "$candidate"' EXIT
        if sudo test -e "$f"; then
          sudo test -f "$f"
          sudo jq '
            if type != "object" then error("daemon configuration must be an object")
            elif ((.["registry-mirrors"] // []) | type) != "array" then error("mirrors must be an array")
            elif all((.["registry-mirrors"] // [])[]; type == "string") | not then error("mirrors must be strings")
            else .["registry-mirrors"] = (
              ["https://mirror.gcr.io"] + ((.["registry-mirrors"] // []) | map(rtrimstr("/")))
              | reduce .[] as $mirror ([]; if index($mirror) == null then . + [$mirror] else . end)
            ) end
          ' "$f" | sudo tee "$candidate" >/dev/null
          sudo chown --reference="$f" "$candidate"
          sudo chmod --reference="$f" "$candidate"
        else
          jq -n '{"registry-mirrors":["https://mirror.gcr.io"]}' | sudo tee "$candidate" >/dev/null
          sudo chmod 0644 "$candidate"
        fi
        sudo dockerd --validate --config-file "$candidate"
        expected=$(sudo jq -c '.["registry-mirrors"]' "$candidate")
        current=$(docker info --format '{{json .RegistryConfig.Mirrors}}' | jq -c '(. // []) | map(rtrimstr("/"))')
        if sudo cmp -s "$f" "$candidate" && [[ "$current" == "$expected" ]]; then
          echo 'Docker registry mirror already active'
          exit 0
        fi
        sudo mv "$candidate" "$f"
        # Registry mirrors support SIGHUP, preserving the daemon and running containers.
        sudo systemctl reload docker.service
        for attempt in {1..20}; do
          current=$(docker info --format '{{json .RegistryConfig.Mirrors}}' | jq -c '(. // []) | map(rtrimstr("/"))')
          if [[ "$current" == "$expected" ]]; then
            echo 'Docker registry mirror active: https://mirror.gcr.io'
            exit 0
          fi
          sleep 0.1
        done
        echo "Docker reload did not activate the expected mirrors after $attempt checks" >&2
        exit 1
