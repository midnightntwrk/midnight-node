name: Tree Cache Guard Save
description: Save a cache entry marking this job as passed for the given key

inputs:
  key:
    description: Cache key from tree-cache-guard check step
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      if: inputs.key != '' && inputs.key != 'no-cache-workflow-override'
      run: mkdir -p /tmp/ci-sentinel && touch /tmp/ci-sentinel/ok

    # Best-effort: the sentinel only skips future re-runs of an already-green
    # tree, so a failed save must never fail the job that just passed.
    - uses: actions/cache/save@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 #v4
      if: inputs.key != '' && inputs.key != 'no-cache-workflow-override'
      continue-on-error: true
      with:
        key: ${{ inputs.key }}
        path: /tmp/ci-sentinel
