name: Scan
permissions: {}

on:
  push:
    branches: [main]
    paths-ignore:
      - "changes/**"
  pull_request:
    branches: [main]
  workflow_dispatch: {}   # so you can still run it manually
  schedule:
    - cron: "0 0 * * *"   # run daily at midnight UTC
concurrency:
  group: ${{ github.event_name != 'merge_group' && format('{0}-{1}', github.workflow, github.head_ref) || github.run_id }}
  cancel-in-progress: true

env:
  # needed to stop rate limiting of compact download.
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      pull-requests: write
      security-events: write
      statuses: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  #v7.0.1

      - id: guard
        uses: ./.github/actions/tree-cache-guard

      - name: Scan code
        if: steps.guard.outputs.hit != 'true'
        uses: midnightntwrk/upload-sarif-github-action@ead6c0e0472da1821eb2732eaed3e120a9aaa0ea # v2.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # The action's default checks less Vulnerabilities. That check is one
          # count of every advisory in the tree, and this repo always trails
          # polkadot-sdk releases a little, so it would stay red. osv-scanner
          # already gates each advisory on its own, with per-advisory waivers in
          # osv-scanner.toml.
          scorecard_checks: "Binary-Artifacts,Dangerous-Workflow,Dependency-Update-Tool,License,Pinned-Dependencies,Security-Policy,Token-Permissions"

      - uses: ./.github/actions/tree-cache-guard/save
        if: steps.guard.outputs.hit != 'true'
        with:
          key: ${{ steps.guard.outputs.key }}
