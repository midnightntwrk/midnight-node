name: Scan
permissions: {}

on:
  push:
    branches: [main]
    paths-ignore:
      - "changes/**"
  pull_request:
    branches: [main]
  workflow_dispatch: {}   # so you can still run it manually
  schedule:
    - cron: "0 0 * * *"   # run daily at midnight UTC
concurrency:
  group: ${{ github.event_name != 'merge_group' && format('{0}-{1}', github.workflow, github.head_ref) || github.run_id }}
  cancel-in-progress: true

env:
  # needed to stop rate limiting of compact download.
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      pull-requests: write
      security-events: write
      statuses: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  #v7.0.1

      - id: guard
        uses: ./.github/actions/tree-cache-guard

      - name: Scan code
        if: steps.guard.outputs.hit != 'true'
        # Trial of upload-sarif-github-action PR 157: dependency licences are
        # checked against the default allowlist (HIGH violation, LOW unknown).
        # Re-pin to the release once it ships.
        uses: midnightntwrk/upload-sarif-github-action@0483b6038e454b6bab7938e3b2d888b6a1fd5fe6 # giles-osv-licenses
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/tree-cache-guard/save
        if: steps.guard.outputs.hit != 'true'
        with:
          key: ${{ steps.guard.outputs.key }}
