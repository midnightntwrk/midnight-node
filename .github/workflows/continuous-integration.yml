name: CI + E2E

env:
  CI_CACHE_TRUSTED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
  # Define environment variables for AWS credentials and region
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_EKS_CLUSTER_NAME: ${{ secrets.AWS_EKS_CLUSTER_NAME }}
  # Registry the images built here are pushed to and pulled from. Derived from the repo owner
  # so a fork or private clone never touches midnightntwrk's registries. Upstream's private
  # GHCR namespace is hyphenated (midnight-ntwrk) while the org login is not, so the canonical
  # branch has to name the repo explicitly rather than derive it. GHCR_REGISTRY_PUBLIC is the
  # public mirror, which only the canonical repo has; everywhere else it equals GHCR_REGISTRY
  # and the mirror push is a no-op. Same derivation .envrc forwards to earthly as build args.
  GHCR_REGISTRY: ${{ github.repository == 'midnightntwrk/midnight-node' && 'ghcr.io/midnight-ntwrk' || format('ghcr.io/{0}', github.repository_owner) }}
  GHCR_REGISTRY_PUBLIC: ${{ github.repository == 'midnightntwrk/midnight-node' && 'ghcr.io/midnightntwrk' || format('ghcr.io/{0}', github.repository_owner) }}
  # Fork PRs get no secrets and a read-only token, so they cannot push images to GHCR.
  # Their builds hand images to downstream jobs as artifacts instead, named under
  # FORK_IMAGE_REGISTRY (see .github/actions/save-fork-images and load-fork-images).
  # Internal PRs and merge_group never take the fork path.
  IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
  # 172.17.0.1 is Docker's default bridge (docker0) gateway, the one address both the
  # host daemon and earthly's buildkitd container can reach; :5000 is the throwaway
  # registry load-fork-images starts. load-fork-images fails if the gateway differs.
  FORK_IMAGE_REGISTRY: 172.17.0.1:5000

on:
  merge_group:
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Force rebuild even if images already exist"
        required: false
        type: boolean
        default: false
# no top level default permissions for security reasons
permissions: {}

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow, github.head_ref) || github.run_id }}
  cancel-in-progress: true
jobs:
  scope:
    name: Classify changed inputs
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      product: ${{ steps.scope.outputs.product }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        run: python3 scripts/ci/scope.py

  prepare-local-e2e:
    needs: [scope]
    name: Prepare local integration test binary
    if: contains(fromJSON('["midnightntwrk", "shieldedtech"]'), github.repository_owner) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ needs.scope.outputs.product != 'true' && fromJSON('["ubuntu-24.04"]') || ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && fromJSON('["ubuntu-24.04"]') || fromJSON('["self-hosted", "tier:large"]')) }}
    permissions:
      contents: read
    steps:
      - name: Documentation-only check
        if: needs.scope.outputs.product != 'true'
        run: echo 'No product inputs changed; this check is satisfied.'
      - name: Checkout
        if: needs.scope.outputs.product == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - uses: EarthBuild/actions-setup@f4d20223e70dbb43b5fc08c4d857ab9cf0dbf3ae # v2.2.0
        if: needs.scope.outputs.product == 'true'
        with:
          version: v0.8.18
          github-token: ${{ github.token }}
          use-cache: false

      - name: Isolate registry credentials
        if: needs.scope.outputs.product == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/.docker"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/.docker" >> "$GITHUB_ENV"

      - name: Login to Docker Hub
        if: needs.scope.outputs.product == 'true'
        continue-on-error: true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f #v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_MIDNIGHTNTWRK_USER }}
          password: ${{ secrets.DOCKERHUB_MIDNIGHTNTWRK_TOKEN }}

      - name: Prepare local integration test binary
        if: needs.scope.outputs.product == 'true'
        env:
          NODE_GIT_TOKEN: ${{ secrets.NODE_GIT_TOKEN }}
          EARTHLY_REMOTE_CACHE: ""
          ACTIONS_CACHE_URL: ""
          ACTIONS_RUNTIME_URL: ""
          TMPDIR: ${{ runner.temp }}
        run: |
          . ./.envrc
          earth -P --strict \
            +local-env-ci-prepare

  prepare-toolkit:
    needs: [scope]
    name: Prepare toolkit test binaries
    if: contains(fromJSON('["midnightntwrk", "shieldedtech"]'), github.repository_owner) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ needs.scope.outputs.product != 'true' && fromJSON('["ubuntu-24.04"]') || ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && fromJSON('["ubuntu-24.04"]') || fromJSON('["self-hosted", "tier:large"]')) }}
    permissions:
      contents: read
    steps:
      - name: Documentation-only check
        if: needs.scope.outputs.product != 'true'
        run: echo 'No product inputs changed; this check is satisfied.'
      - name: Checkout
        if: needs.scope.outputs.product == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - uses: EarthBuild/actions-setup@f4d20223e70dbb43b5fc08c4d857ab9cf0dbf3ae # v2.2.0
        if: needs.scope.outputs.product == 'true'
        with:
          version: v0.8.18
          github-token: ${{ github.token }}
          use-cache: false

      - name: Isolate registry credentials
        if: needs.scope.outputs.product == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/.docker"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/.docker" >> "$GITHUB_ENV"

      - name: Login to Docker Hub
        if: needs.scope.outputs.product == 'true'
        continue-on-error: true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f #v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_MIDNIGHTNTWRK_USER }}
          password: ${{ secrets.DOCKERHUB_MIDNIGHTNTWRK_TOKEN }}

      - name: Prepare toolkit test binaries
        if: needs.scope.outputs.product == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.MIDNIGHTCI_PACKAGES_READ }}
          NODE_GIT_TOKEN: ${{ secrets.NODE_GIT_TOKEN }}
          EARTHLY_REMOTE_CACHE: ""
          ACTIONS_CACHE_URL: ""
          ACTIONS_RUNTIME_URL: ""
          TMPDIR: ${{ runner.temp }}
        run: |
          . ./.envrc
          earth --secret GITHUB_TOKEN="$GITHUB_TOKEN" -P --strict \
            +prepare-toolkit-tests

  run:
    needs: [scope]
    name: Build node and images (linux/amd64, self-hosted-tier:large, amd64)
    permissions:
      id-token: write
      contents: read
    # TEST PR — points at the new self-hosted runner pool to validate end-to-end
    # build performance. Revert before merge.
    # Self-hosted only in our own orgs (other repos have no such runners and would queue
    # forever) and never for fork PRs (keeps untrusted code off our infrastructure).
    runs-on: ${{ needs.scope.outputs.product != 'true' && fromJSON('["ubuntu-24.04"]') || ((contains(fromJSON('["midnightntwrk", "shieldedtech"]'), github.repository_owner) && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && fromJSON('["self-hosted", "tier:large"]') || fromJSON('["ubuntu-24.04"]')) }}
    env:
      FORCE_COLOR: 1
    outputs:
      sha: ${{ steps.get_sha.outputs.sha }}
      node_image_tag: ${{ steps.image_tags.outputs.node_image_tag }}
      node_image_tag_no_dev: ${{ steps.image_tags.outputs.node_image_tag_no_dev }}
      toolkit_image_tag: ${{ steps.image_tags.outputs.toolkit_image_tag }}
      node_image: ${{ steps.image_tags.outputs.node_image }}
      toolkit_image: ${{ steps.image_tags.outputs.toolkit_image }}
      skip_build: ${{ steps.check_images.outputs.skip_build }}
    steps:
      - name: Documentation-only check
        if: needs.scope.outputs.product != 'true'
        run: echo 'No product inputs changed; this check is satisfied.'
      - uses: EarthBuild/actions-setup@f4d20223e70dbb43b5fc08c4d857ab9cf0dbf3ae # v2.2.0
        if: needs.scope.outputs.product == 'true'
        with:
          version: v0.8.18
          github-token: ${{ github.token }}
          # Keep `use-cache: false` — that flag controls whether EarthBuild
          # caches state into GitHub Actions cache (which sets up TLS-secured
          # buildkitd inside the runner). We don't want that path on
          # self-hosted runners; cache comes from the local earthly buildkitd
          # the runner manages itself.
          use-cache: false

      - name: Checkout node repository
        if: needs.scope.outputs.product == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          submodules: true

      - name: Get current commit SHA
        if: needs.scope.outputs.product == 'true'
        id: get_sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # TEST ONLY — let earthly manage its own buildkitd on the self-hosted
      # runner, but without TLS (no certs are provisioned). Earthly defaults
      # to TLS for its managed buildkitd, which fails on a fresh runner.
      # Appending `tls_enabled: false` to the repo's existing .earthly/config.yml
      # keeps the rest of midnight-node's earthly settings intact.
      - name: Disable earthly TLS (self-hosted runner has no certs)
        if: needs.scope.outputs.product == 'true'
        run: |
          echo "    tls_enabled: false" >> .earthly/config.yml
          echo "--- updated .earthly/config.yml ---"
          cat .earthly/config.yml

      # Pin DOCKER_CONFIG to a per-job temp dir so concurrent jobs get isolated
      # docker auth and can't clobber each other's registry logins mid-build
      # (which would otherwise drop a registry credential and 403 the push).
      # docker/login-action writes here and earthly reads it (earthly honors
      # DOCKER_CONFIG). Set via $GITHUB_ENV because runner.temp is unavailable
      # in job-level env.
      - name: Isolate docker config
        if: needs.scope.outputs.product == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/.docker"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/.docker" >> "$GITHUB_ENV"

      - name: Login to GHCR
        if: needs.scope.outputs.product == 'true' && (env.IS_FORK_PR != 'true')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f #v4.6.0
        with:
          registry: ghcr.io
          username: MidnightCI
          password: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}

      # Earthfile FROMs midnightntwrk/midnight-node-ci and several library/*
      # images that resolve to docker.io. With --push, earthly tries to write
      # inline cache back to the midnightntwrk Docker Hub namespace and fails
      # auth without this login.
      # Non-fatal: the +images push targets ghcr.io only (authed by the GHCR
      # login above) and the docker.io base images are public, so the build
      # still pulls + pushes without these creds. Dependabot runs don't have
      # the DOCKERHUB_* secrets, so this step would otherwise hard-fail there.
      - name: Login to Docker Hub
        if: needs.scope.outputs.product == 'true' && (env.IS_FORK_PR != 'true')
        continue-on-error: true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f #v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_MIDNIGHTNTWRK_USER }}
          password: ${{ secrets.DOCKERHUB_MIDNIGHTNTWRK_TOKEN }}

      # Both logins above wrote to the isolated $DOCKER_CONFIG/config.json (see
      # the DOCKER_CONFIG note at job level). Confirm both registries are present
      # before the build so an auth regression surfaces here rather than as an
      # opaque anonymous-token 403 mid-push.
      - name: Verify registry creds visible to earthly
        if: needs.scope.outputs.product == 'true' && (env.IS_FORK_PR != 'true')
        run: |
          echo "DOCKER_CONFIG=${DOCKER_CONFIG:-<unset>}"
          echo "Registries with creds:"
          jq '.auths | keys' "$DOCKER_CONFIG/config.json"

      - name: Compute image tags
        if: needs.scope.outputs.product == 'true'
        id: image_tags
        run: |
          content_hash=$(git rev-parse "HEAD^{tree}" | cut -c1-12)
          version=$(grep -m 1 '^version =' node/Cargo.toml | cut -d '"' -f2)
          # Image basename follows the repo name, so a fork publishes <owner>/<its-repo>
          # rather than overwriting midnight-node. Taken from $GITHUB_REPOSITORY rather than
          # github.event.repository.name, which is absent from merge_group/schedule payloads.
          image_repo="${GITHUB_REPOSITORY#*/}"
          registry="$GHCR_REGISTRY"
          if [ "$IS_FORK_PR" = "true" ]; then
            registry="${FORK_IMAGE_REGISTRY}/${GHCR_REGISTRY#ghcr.io/}"
          fi
          {
            echo "node_image_tag=${version}-dev-${content_hash}-amd64"
            echo "node_image_tag_no_dev=${version}-${content_hash}-amd64"
            echo "toolkit_image_tag=${version}-${content_hash}-amd64"
            echo "image_repo=${image_repo}"
            echo "node_image=${registry}/${image_repo}"
            echo "toolkit_image=${registry}/${image_repo}-toolkit"
          } >> "$GITHUB_OUTPUT"

      - name: Check for existing images
        if: needs.scope.outputs.product == 'true'
        id: check_images
        env:
          FORCE_REBUILD: ${{ github.event.inputs.force_rebuild }}
          NODE_IMAGE: ${{ steps.image_tags.outputs.node_image }}
          NODE_IMAGE_TAG: ${{ steps.image_tags.outputs.node_image_tag }}
          TOOLKIT_IMAGE: ${{ steps.image_tags.outputs.toolkit_image }}
          TOOLKIT_IMAGE_TAG: ${{ steps.image_tags.outputs.toolkit_image_tag }}
        run: |
          # Fork PRs can't reuse GHCR images, so they always build.
          if [ "$FORCE_REBUILD" = "true" ] || [ "$IS_FORK_PR" = "true" ]; then
            echo "skip_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          NODE_EXISTS=$(docker manifest inspect "${NODE_IMAGE}:${NODE_IMAGE_TAG}" > /dev/null 2>&1 && echo true || echo false)
          TOOLKIT_EXISTS=$(docker manifest inspect "${TOOLKIT_IMAGE}:${TOOLKIT_IMAGE_TAG}" > /dev/null 2>&1 && echo true || echo false)
          if [ "$NODE_EXISTS" = "true" ] && [ "$TOOLKIT_EXISTS" = "true" ]; then
            echo "skip_build=true" >> "$GITHUB_OUTPUT"
            echo "Images already exist, skipping build"
          else
            echo "skip_build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run build
        if: needs.scope.outputs.product == 'true' && (steps.check_images.outputs.skip_build != 'true')
        env:
          NODE_GIT_TOKEN: ${{ secrets.NODE_GIT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.MIDNIGHTCI_PACKAGES_READ }}
          # Self-hosted-runner-specific: runner systemd unit has PrivateTmp=true,
          # so /tmp is in a per-service mount namespace that dockerd (and therefore
          # earthly's sibling buildkitd container) can't see. Force earthly's
          # temp dir to live under $RUNNER_TEMP which is outside PrivateTmp.
          TMPDIR: ${{ runner.temp }}
          # Belt-and-suspenders: an older version of the runner .env set
          # EARTHLY_REMOTE_CACHE=local, which earthly resolves to
          # docker.io/library/local (unauthenticated, push fails). The .env
          # has been cleaned, but force-clear in case any runner process
          # still has the stale value cached.
          EARTHLY_REMOTE_CACHE: ""
          # Same belt-and-suspenders for ACTIONS_CACHE_URL — earthly auto-uses
          # it as a cache target if set, and our local cache server doesn't
          # accept GHA's ACTIONS_RUNTIME_TOKEN.
          ACTIONS_CACHE_URL: ""
          ACTIONS_RUNTIME_URL: ""
          STRIP_BINARIES: ${{ github.event.repository.visibility != 'public' }}
        run: |
          # Retry the earthly invocation up to 3 times. Buildkit's default
          # response-header timeout for registry uploads (~30s in the
          # underlying containerd resolver) isn't tunable via buildkitd.toml,
          # and the self-hosted -> ghcr.io path occasionally drops a layer push
          # with "timeout awaiting response headers". Earthly's cache means
          # retries skip everything that already succeeded — they essentially
          # only retry the failing push.
          #
          # No ::group:: wrapping — failures need to be visible by default in
          # the GHA log, not collapsed.
          #
          # Fork PRs build without --push; earthly loads the images into the local
          # daemon for the save step below.
          PUSH_FLAG="--push"
          if [ "$IS_FORK_PR" = "true" ]; then
            PUSH_FLAG=""
          fi
          . ./.envrc
          for attempt in 1 2 3; do
            echo "----- earthly attempt $attempt/3 -----"
            if earth --secret GITHUB_TOKEN="$GITHUB_TOKEN" -P $PUSH_FLAG +images --STRIP_BINARIES="$STRIP_BINARIES"; then
              exit 0
            fi
            echo "----- earthly attempt $attempt failed -----"
            if [ $attempt -lt 3 ]; then
              echo "sleeping 30s before retry"
              sleep 30
            fi
          done
          echo "earthly failed after 3 attempts"
          exit 1

      # Earthly tags images under GHCR_REGISTRY; retag them under the fork names the
      # downstream jobs were given.
      - name: Tag images for downstream jobs (fork PRs)
        if: needs.scope.outputs.product == 'true' && (env.IS_FORK_PR == 'true')
        env:
          IMAGE_REPO: ${{ steps.image_tags.outputs.image_repo }}
          NODE_IMAGE: ${{ steps.image_tags.outputs.node_image }}
          NODE_IMAGE_TAG: ${{ steps.image_tags.outputs.node_image_tag }}
          TOOLKIT_IMAGE: ${{ steps.image_tags.outputs.toolkit_image }}
          TOOLKIT_IMAGE_TAG: ${{ steps.image_tags.outputs.toolkit_image_tag }}
        run: |
          docker tag "${GHCR_REGISTRY}/${IMAGE_REPO}:${NODE_IMAGE_TAG}" "${NODE_IMAGE}:${NODE_IMAGE_TAG}"
          docker tag "${GHCR_REGISTRY}/${IMAGE_REPO}-toolkit:${TOOLKIT_IMAGE_TAG}" "${TOOLKIT_IMAGE}:${TOOLKIT_IMAGE_TAG}"

      - name: Save images for downstream jobs (fork PRs)
        if: needs.scope.outputs.product == 'true' && (env.IS_FORK_PR == 'true')
        uses: ./.github/actions/save-fork-images # zizmor: ignore[self-repository] actionlint does not yet accept $/
        with:
          artifact-name: fork-images-amd64
          images: |
            ${{ steps.image_tags.outputs.node_image }}:${{ steps.image_tags.outputs.node_image_tag }}
            ${{ steps.image_tags.outputs.toolkit_image }}:${{ steps.image_tags.outputs.toolkit_image_tag }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.scope.outputs.product == 'true' && ((success() || failure()) && steps.check_images.outputs.skip_build != 'true')
        with:
          name: Wasm Runtime and binaries (amd64)
          path: artifacts-amd64/

      - name: Upload test artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.scope.outputs.product == 'true' && ((success() || failure()) && steps.check_images.outputs.skip_build != 'true')
        with:
          name: Test artifacts (amd64)
          path: test-artifacts-amd64/

  sbom-scan-node:
    if: needs.scope.outputs.product == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    name: SBOM/Scan Node
    needs: [scope, run]
    # Scans the image pushed to GHCR, which fork PRs don't have.
    uses: ./.github/workflows/sbom-scan-image.yml
    with:
      image: ${{ needs.run.outputs.node_image }}:${{ needs.run.outputs.node_image_tag }}
      sbom-artifact-name: sbom-midnight-node-ci
      skip-attestation: true
    secrets:
      MIDNIGHTCI_PACKAGES_WRITE: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}
      DOCKERHUB_MIDNIGHTNTWRK_USER: ${{ secrets.DOCKERHUB_MIDNIGHTNTWRK_USER }}
      DOCKERHUB_MIDNIGHTNTWRK_TOKEN: ${{ secrets.DOCKERHUB_MIDNIGHTNTWRK_TOKEN }}

  sbom-scan-toolkit:
    if: needs.scope.outputs.product == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    name: SBOM/Scan Toolkit
    needs: [scope, run]
    # Scans the image pushed to GHCR, which fork PRs don't have.
    uses: ./.github/workflows/sbom-scan-image.yml
    with:
      image: ${{ needs.run.outputs.toolkit_image }}:${{ needs.run.outputs.toolkit_image_tag }}
      sbom-artifact-name: sbom-midnight-node-toolkit-ci
      skip-attestation: true
    secrets:
      MIDNIGHTCI_PACKAGES_WRITE: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}
      DOCKERHUB_MIDNIGHTNTWRK_USER: ${{ secrets.DOCKERHUB_MIDNIGHTNTWRK_USER }}
      DOCKERHUB_MIDNIGHTNTWRK_TOKEN: ${{ secrets.DOCKERHUB_MIDNIGHTNTWRK_TOKEN }}

  run-arm64:
    needs: [scope]
    name: Build node and images (arm64)
    permissions:
      id-token: write
      contents: read
    runs-on: ${{ needs.scope.outputs.product != 'true' && 'ubuntu-24.04' || 'ubuntu-latest-8-core-arm64' }}
    env:
      FORCE_COLOR: 1
    steps:
      - name: Documentation-only check
        if: needs.scope.outputs.product != 'true'
        run: echo 'No product inputs changed; this check is satisfied.'
      - uses: EarthBuild/actions-setup@f4d20223e70dbb43b5fc08c4d857ab9cf0dbf3ae # v2.2.0
        if: needs.scope.outputs.product == 'true'
        with:
          version: v0.8.18
          github-token: ${{ github.token }}
          use-cache: false

      - name: Checkout node repository
        if: needs.scope.outputs.product == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          submodules: true

      - name: Login to GHCR
        if: needs.scope.outputs.product == 'true' && (env.IS_FORK_PR != 'true')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f #v4.6.0
        with:
          registry: ghcr.io
          username: MidnightCI
          password: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}

      - name: Compute image tags
        if: needs.scope.outputs.product == 'true'
        id: image_tags
        run: |
          content_hash=$(git rev-parse "HEAD^{tree}" | cut -c1-12)
          version=$(grep -m 1 '^version =' node/Cargo.toml | cut -d '"' -f2)
          image_repo="${GITHUB_REPOSITORY#*/}"
          {
            echo "node_image_tag=${version}-dev-${content_hash}-arm64"
            echo "toolkit_image_tag=${version}-${content_hash}-arm64"
            echo "node_image=${GHCR_REGISTRY}/${image_repo}"
            echo "toolkit_image=${GHCR_REGISTRY}/${image_repo}-toolkit"
          } >> "$GITHUB_OUTPUT"

      - name: Check for existing images
        if: needs.scope.outputs.product == 'true'
        id: check_images
        env:
          FORCE_REBUILD: ${{ github.event.inputs.force_rebuild }}
          NODE_IMAGE: ${{ steps.image_tags.outputs.node_image }}
          NODE_IMAGE_TAG: ${{ steps.image_tags.outputs.node_image_tag }}
          TOOLKIT_IMAGE: ${{ steps.image_tags.outputs.toolkit_image }}
          TOOLKIT_IMAGE_TAG: ${{ steps.image_tags.outputs.toolkit_image_tag }}
        run: |
          if [ "$FORCE_REBUILD" = "true" ] || [ "$IS_FORK_PR" = "true" ]; then
            echo "skip_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          NODE_EXISTS=$(docker manifest inspect "${NODE_IMAGE}:${NODE_IMAGE_TAG}" > /dev/null 2>&1 && echo true || echo false)
          TOOLKIT_EXISTS=$(docker manifest inspect "${TOOLKIT_IMAGE}:${TOOLKIT_IMAGE_TAG}" > /dev/null 2>&1 && echo true || echo false)
          if [ "$NODE_EXISTS" = "true" ] && [ "$TOOLKIT_EXISTS" = "true" ]; then
            echo "skip_build=true" >> "$GITHUB_OUTPUT"
            echo "Images already exist, skipping build"
          else
            echo "skip_build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run build
        if: needs.scope.outputs.product == 'true' && (steps.check_images.outputs.skip_build != 'true')
        env:
          NODE_GIT_TOKEN: ${{ secrets.NODE_GIT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.MIDNIGHTCI_PACKAGES_READ }}
        run: |
          # Fork PRs only check that arm64 builds; nothing downstream consumes the images.
          PUSH_FLAG="--push"
          if [ "$IS_FORK_PR" = "true" ]; then
            PUSH_FLAG=""
          fi
          . ./.envrc && earth --secret GITHUB_TOKEN="$GITHUB_TOKEN" -P $PUSH_FLAG +images

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.scope.outputs.product == 'true' && ((success() || failure()) && steps.check_images.outputs.skip_build != 'true')
        with:
          name: Wasm Runtime and binaries (arm64)
          path: artifacts-arm64/

      - name: Upload test artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.scope.outputs.product == 'true' && ((success() || failure()) && steps.check_images.outputs.skip_build != 'true')
        with:
          name: Test artifacts (arm64)
          path: test-artifacts-arm64/

  # Combine the per-platform images (`<tag>-amd64`, `<tag>-arm64`) pushed by
  # `run` and `run-arm64` under a single multi-arch tag.
  push-combined-manifest:
    name: Push combined multi-arch manifest
    needs: [scope, run, run-arm64]
    # Fork PRs push no per-platform images to combine.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    steps:
      - name: Documentation-only check
        if: needs.scope.outputs.product != 'true'
        run: echo 'No product inputs changed; this check is satisfied.'
      - name: Checkout node repository
        if: needs.scope.outputs.product == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Login to GHCR
        if: needs.scope.outputs.product == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f #v4.6.0
        with:
          registry: ghcr.io
          username: MidnightCI
          password: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}

      - name: Compute combined image tags
        if: needs.scope.outputs.product == 'true'
        id: tags
        env:
          NODE_AMD64_TAG: ${{ needs.run.outputs.node_image_tag_no_dev }}
          TOOLKIT_AMD64_TAG: ${{ needs.run.outputs.toolkit_image_tag }}
        run: |
          node_amd64="$NODE_AMD64_TAG"
          toolkit_amd64="$TOOLKIT_AMD64_TAG"
          node_combined="${node_amd64%-amd64}"
          toolkit_combined="${toolkit_amd64%-amd64}"
          node_arm64="${node_combined}-arm64"
          toolkit_arm64="${toolkit_combined}-arm64"
          {
            echo "node_combined=${node_combined}"
            echo "node_amd64=${node_amd64}"
            echo "node_arm64=${node_arm64}"
            echo "toolkit_combined=${toolkit_combined}"
            echo "toolkit_amd64=${toolkit_amd64}"
            echo "toolkit_arm64=${toolkit_arm64}"
          } >> "$GITHUB_OUTPUT"

      - name: Push combined manifest for midnight-node
        if: needs.scope.outputs.product == 'true'
        env:
          COMBINED_TAG: ${{ steps.tags.outputs.node_combined }}
          AMD64_TAG: ${{ steps.tags.outputs.node_amd64 }}
          ARM64_TAG: ${{ steps.tags.outputs.node_arm64 }}
        run: |
          # Recomputed here rather than carried as a job output: Actions drops any output
          # whose value contains a secret, and DOCKERHUB_MIDNIGHTNTWRK_USER is the literal
          # string "midnightntwrk", which appears in the public image name. The output
          # arrived empty and `imagetools create -t ":<tag>"` failed with "invalid
          # reference format". The private ghcr.io/midnight-ntwrk name is hyphenated, so it
          # is unaffected and still travels as an output.
          IMAGE="${GHCR_REGISTRY_PUBLIC}/${GITHUB_REPOSITORY#*/}"

          docker buildx imagetools create \
            -t "${IMAGE}:${COMBINED_TAG}" \
            "${IMAGE}:${AMD64_TAG}" \
            "${IMAGE}:${ARM64_TAG}"
          docker buildx imagetools inspect "${IMAGE}:${COMBINED_TAG}"

      - name: Push combined manifest for midnight-node-toolkit
        if: needs.scope.outputs.product == 'true'
        env:
          COMBINED_TAG: ${{ steps.tags.outputs.toolkit_combined }}
          AMD64_TAG: ${{ steps.tags.outputs.toolkit_amd64 }}
          ARM64_TAG: ${{ steps.tags.outputs.toolkit_arm64 }}
        run: |
          # Recomputed here rather than carried as a job output: Actions drops any output
          # whose value contains a secret, and DOCKERHUB_MIDNIGHTNTWRK_USER is the literal
          # string "midnightntwrk", which appears in the public image name. The output
          # arrived empty and `imagetools create -t ":<tag>"` failed with "invalid
          # reference format". The private ghcr.io/midnight-ntwrk name is hyphenated, so it
          # is unaffected and still travels as an output.
          IMAGE="${GHCR_REGISTRY_PUBLIC}/${GITHUB_REPOSITORY#*/}-toolkit"

          docker buildx imagetools create \
            -t "${IMAGE}:${COMBINED_TAG}" \
            "${IMAGE}:${AMD64_TAG}" \
            "${IMAGE}:${ARM64_TAG}"
          docker buildx imagetools inspect "${IMAGE}:${COMBINED_TAG}"

  check-unused-deps:
    needs: [scope]
    permissions:
      contents: read
      actions: write
    name: Check Unused Dependencies
    runs-on: ubuntu-24.04
    steps:
      - name: Documentation-only check
        if: needs.scope.outputs.product != 'true'
        run: echo 'No product inputs changed; this check is satisfied.'
      - name: Checkout node repository
        if: needs.scope.outputs.product == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          submodules: true

      - id: guard
        if: needs.scope.outputs.product == 'true'
        uses: ./.github/actions/tree-cache-guard
        with:
          hmac-key: ${{ secrets.TREE_GUARD_HMAC }}

      - uses: EarthBuild/actions-setup@f4d20223e70dbb43b5fc08c4d857ab9cf0dbf3ae # v2.2.0
        if: needs.scope.outputs.product == 'true' && (steps.guard.outputs.hit != 'true')
        with:
          version: v0.8.18
          github-token: ${{ github.token }}
          use-cache: false

      - name: Check Deps
        if: needs.scope.outputs.product == 'true' && (steps.guard.outputs.hit != 'true')
        env:
          NODE_GIT_TOKEN: ${{ secrets.NODE_GIT_TOKEN }}
        run: |
          . ./.envrc && earth +check-deps

      - uses: ./.github/actions/tree-cache-guard/save
        if: needs.scope.outputs.product == 'true' && (steps.guard.outputs.hit != 'true')
        with:
          key: ${{ steps.guard.outputs.key }}

  rebuild-genesis:
    name: Check Genesis Rebuild
    needs: [scope, run]
    permissions:
      id-token: write
      contents: read
      actions: write

    runs-on: ubuntu-24.04
    env:
      FORCE_COLOR: 1
    steps:
      - name: Documentation-only check
        if: needs.scope.outputs.product != 'true'
        run: echo 'No product inputs changed; this check is satisfied.'
      - name: Checkout node repository
        if: needs.scope.outputs.product == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          submodules: true

      - id: guard
        if: needs.scope.outputs.product == 'true'
        uses: ./.github/actions/tree-cache-guard
        with:
          hmac-key: ${{ secrets.TREE_GUARD_HMAC }}

      - uses: EarthBuild/actions-setup@f4d20223e70dbb43b5fc08c4d857ab9cf0dbf3ae # v2.2.0
        if: needs.scope.outputs.product == 'true' && (steps.guard.outputs.hit != 'true')
        with:
          version: v0.8.18
          github-token: ${{ github.token }}
          use-cache: false

      - name: Login to GHCR
        if: needs.scope.outputs.product == 'true' && (steps.guard.outputs.hit != 'true' && env.IS_FORK_PR != 'true')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f #v4.6.0
        with:
          registry: ghcr.io
          username: MidnightCI
          password: ${{ secrets.MIDNIGHTCI_PACKAGES_READ }}

      - name: Load images (fork PRs)
        if: needs.scope.outputs.product == 'true' && (steps.guard.outputs.hit != 'true' && env.IS_FORK_PR == 'true')
        uses: ./.github/actions/load-fork-images # zizmor: ignore[self-repository] actionlint does not yet accept $/
        with:
          artifact-pattern: fork-images-amd64
          registry: ${{ env.FORK_IMAGE_REGISTRY }}

      - name: Generate dummy genesis seeds
        if: needs.scope.outputs.product == 'true' && (steps.guard.outputs.hit != 'true')
        run: |
          mkdir -p secrets
          for cfg in res/cfg/*.toml; do
            network=$(basename "$cfg" .toml)
            python3 scripts/generate-genesis-seeds.py -c 4 -o "secrets/${network}-genesis-seeds.json"
          done

      - name: Check Genesis Rebuild
        if: needs.scope.outputs.product == 'true' && (steps.guard.outputs.hit != 'true')
        env:
          NODE_GIT_TOKEN: ${{ secrets.NODE_GIT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.MIDNIGHTCI_PACKAGES_READ }}
          NODE_IMAGE: ${{ needs.run.outputs.node_image }}
          NODE_IMAGE_TAG: ${{ needs.run.outputs.node_image_tag }}
          TOOLKIT_IMAGE: ${{ needs.run.outputs.toolkit_image }}
          TOOLKIT_IMAGE_TAG: ${{ needs.run.outputs.toolkit_image_tag }}
        run: |
          . ./.envrc && earth --secret GITHUB_TOKEN="$GITHUB_TOKEN" \
            --build-arg "NODE_IMAGE=${NODE_IMAGE}:${NODE_IMAGE_TAG}" \
            --build-arg "TOOLKIT_IMAGE=${TOOLKIT_IMAGE}:${TOOLKIT_IMAGE_TAG}" \
            +rebuild-genesis

      - uses: ./.github/actions/tree-cache-guard/save
        if: needs.scope.outputs.product == 'true' && (steps.guard.outputs.hit != 'true')
        with:
          key: ${{ steps.guard.outputs.key }}

  # Test pallet-midnight fixture tests - these do NOT require toolkit-js
  test-pallet-fixtures:
    needs: [scope]
    permissions:
      contents: read
      actions: write
    name: Test Pallet Fixtures
    # The fixture tests compile midnight-node-ledger with both ledger generations (and both
    # storage lines) in one crate; rustc is SIGKILLed on the 16 GB ubuntu-latest runner.
    # Same routing as Test Toolkit: self-hosted large for in-repo branches, GitHub-hosted for forks.
    runs-on: ${{ needs.scope.outputs.product == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "tier:large"]') || fromJSON('["ubuntu-24.04"]') }}
    env:
      FORCE_COLOR: 1
    steps:
      - name: Documentation-only check
        if: needs.scope.outputs.product != 'true'
        run: echo 'No product inputs changed; this check is satisfied.'
      - name: Checkout node repository
        if: needs.scope.outputs.product == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          submodules: true

      - id: guard
        if: needs.scope.outputs.product == 'true'
        uses: ./.github/actions/tree-cache-guard
        with:
          hmac-key: ${{ secrets.TREE_GUARD_HMAC }}

      - uses: EarthBuild/actions-setup@f4d20223e70dbb43b5fc08c4d857ab9cf0dbf3ae # v2.2.0
        if: needs.scope.outputs.product == 'true' && (steps.guard.outputs.hit != 'true')
        with:
          version: v0.8.18
          github-token: ${{ github.token }}
          use-cache: false

      - name: Free disk space
        if: needs.scope.outputs.product == 'true' && (steps.guard.outputs.hit != 'true' && runner.environment != 'self-hosted')
        run: scripts/free-disk-space.sh > /tmp/free-disk-space.log 2>&1 &

      - name: Run pallet fixture tests
        if: needs.scope.outputs.product == 'true' && (steps.guard.outputs.hit != 'true')
        env:
          NODE_GIT_TOKEN: ${{ secrets.NODE_GIT_TOKEN }}
        run: |
          . ./.envrc && earth -P --strict \
            +test-pallet-fixtures

      - uses: ./.github/actions/tree-cache-guard/save
        if: needs.scope.outputs.product == 'true' && (steps.guard.outputs.hit != 'true')
        with:
          key: ${{ steps.guard.outputs.key }}

  # Gate job for toolkit E2E tests - if this fails, toolkit E2E tests are skipped
  test-toolkit:
    permissions:
      contents: read
      actions: write
    name: Test Toolkit
    needs: [scope, run, prepare-toolkit]
    if: ${{ !cancelled() && !failure() && needs.run.result == 'success' }}
    # Self-hosted only in our own orgs (other repos have no such runners and would queue
    # forever) and never for fork PRs (keeps untrusted code off our infrastructure).
    runs-on: ${{ needs.scope.outputs.product != 'true' && fromJSON('["ubuntu-24.04"]') || ((contains(fromJSON('["midnightntwrk", "shieldedtech"]'), github.repository_owner) && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && fromJSON('["self-hosted", "tier:large"]') || fromJSON('["ubuntu-24.04"]')) }}
    env:
      FORCE_COLOR: 1
    steps:
      - name: Documentation-only check
        if: needs.scope.outputs.product != 'true'
        run: echo 'No product inputs changed; this check is satisfied.'
      - name: Checkout node repository
        if: needs.scope.outputs.product == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          submodules: true

      - id: guard
        if: needs.scope.outputs.product == 'true'
        uses: ./.github/actions/tree-cache-guard
        with:
          hmac-key: ${{ secrets.TREE_GUARD_HMAC }}

      - uses: EarthBuild/actions-setup@f4d20223e70dbb43b5fc08c4d857ab9cf0dbf3ae # v2.2.0
        if: needs.scope.outputs.product == 'true' && (steps.guard.outputs.hit != 'true')
        with:
          version: v0.8.18
          github-token: ${{ github.token }}
          use-cache: false

      # Isolate docker config per job — see the matching step in the `run` job.
      # runner.temp is not available in job-level env, so set it here.
      - name: Isolate docker config
        if: needs.scope.outputs.product == 'true' && (steps.guard.outputs.hit != 'true')
        run: |
          mkdir -p "$RUNNER_TEMP/.docker"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/.docker" >> "$GITHUB_ENV"

      - name: Login to GHCR
        if: needs.scope.outputs.product == 'true' && (steps.guard.outputs.hit != 'true' && env.IS_FORK_PR != 'true')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f #v4.6.0
        with:
          registry: ghcr.io
          username: MidnightCI
          password: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}

      # Earthfile FROMs midnightntwrk/midnight-node-ci and other docker.io
      # images; earthly pushes inline cache back to those repos under --push,
      # which needs Docker Hub auth.
      # Non-fatal: pushes target ghcr.io and the docker.io base images are
      # public, so the build proceeds without these creds (e.g. Dependabot runs,
      # which don't have the DOCKERHUB_* secrets).
      - name: Login to Docker Hub
        if: needs.scope.outputs.product == 'true' && (steps.guard.outputs.hit != 'true' && env.IS_FORK_PR != 'true')
        continue-on-error: true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f #v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_MIDNIGHTNTWRK_USER }}
          password: ${{ secrets.DOCKERHUB_MIDNIGHTNTWRK_TOKEN }}

      - name: Free disk space
        if: needs.scope.outputs.product == 'true' && (steps.guard.outputs.hit != 'true' && runner.environment != 'self-hosted')
        run: scripts/free-disk-space.sh > /tmp/free-disk-space.log 2>&1 &

      - name: Load images (fork PRs)
        if: needs.scope.outputs.product == 'true' && (steps.guard.outputs.hit != 'true' && env.IS_FORK_PR == 'true')
        uses: ./.github/actions/load-fork-images # zizmor: ignore[self-repository] actionlint does not yet accept $/
        with:
          artifact-pattern: fork-images-amd64
          registry: ${{ env.FORK_IMAGE_REGISTRY }}

      # Self-hosted-runner-specific: earthly's managed buildkitd defaults to TLS
      # but no certs are provisioned on the runner. Append tls_enabled: false
      # to the workspace .earthly/config.yml so earthly skips TLS for its own
      # buildkitd container.
      - name: Disable earthly TLS (self-hosted runner has no certs)
        if: needs.scope.outputs.product == 'true' && (steps.guard.outputs.hit != 'true')
        run: |
          echo "    tls_enabled: false" >> .earthly/config.yml

      - name: Run toolkit tests
        if: needs.scope.outputs.product == 'true' && (steps.guard.outputs.hit != 'true')
        env:
          NODE_GIT_TOKEN: ${{ secrets.NODE_GIT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.MIDNIGHTCI_PACKAGES_READ }}
          # Optional in-DinD Docker Hub login for +test-toolkit's testcontainers
          # pulls (empty on fork PRs → anonymous, rate-limited).
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_MIDNIGHTNTWRK_USER }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_MIDNIGHTNTWRK_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          # Self-hosted-runner-specific: runner systemd unit has PrivateTmp=true.
          # Force earthly's tempdir to live under $RUNNER_TEMP which is
          # outside the per-service PrivateTmp namespace.
          TMPDIR: ${{ runner.temp }}
          # Force-clear in case a runner process has stale EARTHLY_REMOTE_CACHE
          # from before we cleaned the runner .env.
          EARTHLY_REMOTE_CACHE: ""
          # The runner's .env redirects ACTIONS_CACHE_URL to a local cache
          # server. Earthly auto-detects this and tries to push to it with the
          # wrong auth; override to empty for the earthly call.
          ACTIONS_CACHE_URL: ""
          ACTIONS_RUNTIME_URL: ""
          NODE_IMAGE: ${{ needs.run.outputs.node_image }}
          NODE_IMAGE_TAG: ${{ needs.run.outputs.node_image_tag }}
        run: |
          # The remote cache lives in the public mirror, like +test's, so fork PRs can read
          # it. Only merge_group (--push) writes it.
          PUSH_FLAG=""
          if [ "$EVENT_NAME" = "merge_group" ]; then
            PUSH_FLAG="--push"
          fi
          . ./.envrc && earth --secret GITHUB_TOKEN="$GITHUB_TOKEN" \
            --secret DOCKERHUB_USER="$DOCKERHUB_USER" \
            --secret DOCKERHUB_TOKEN="$DOCKERHUB_TOKEN" \
            -P --strict $PUSH_FLAG \
            --remote-cache="${GHCR_REGISTRY_PUBLIC}/${GITHUB_REPOSITORY#*/}:cache-test-toolkit" \
            +test-toolkit \
              --NODE_IMAGE="${NODE_IMAGE}:${NODE_IMAGE_TAG}" \


      - uses: ./.github/actions/tree-cache-guard/save
        if: needs.scope.outputs.product == 'true' && (steps.guard.outputs.hit != 'true')
        with:
          key: ${{ steps.guard.outputs.key }}

