  build-indexer-images:
    needs: [scope]
    if: (github.event_name == 'pull_request' && github.event.pull_request.merged == false) || github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
      packages: read
      contents: write
      actions: write
    outputs:
      indexer_api_image: ${{ steps.image_meta.outputs.indexer_api_image }}
      chain_indexer_image: ${{ steps.image_meta.outputs.chain_indexer_image }}
      wallet_indexer_image: ${{ steps.image_meta.outputs.wallet_indexer_image }}
    steps:
      - name: Documentation-only check
        if: needs.scope.outputs.product != 'true'
        run: echo 'No product inputs changed; this check is satisfied.'
      - name: Checkout
        if: needs.scope.outputs.product == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          submodules: true

      - id: indexer-tests
        if: needs.scope.outputs.product == 'true'
        uses: ./.github/actions/tree-cache-guard
        with:
          check-name: indexer-tests
          tree-path: indexer
          hmac-key: ${{ secrets.TREE_GUARD_HMAC }}

      - name: Login to GHCR
        if: needs.scope.outputs.product == 'true' && (env.IS_FORK_PR != 'true')
        env:
          REGISTRY_TOKEN: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u MidnightCI --password-stdin

      - name: Compute content hash and check for existing images
        if: needs.scope.outputs.product == 'true'
        id: image_meta
        env:
          FORCE_REBUILD: ${{ github.event.inputs.force_rebuild }}
        run: |
          # Use the indexer submodule's tree hash — indexer images depend on submodule content, not main repo
          content_hash=$(git -C indexer rev-parse "HEAD^{tree}" | cut -c1-12)
          registry="$GHCR_REGISTRY"
          if [ "$IS_FORK_PR" = "true" ]; then
            registry="${FORK_IMAGE_REGISTRY}/${GHCR_REGISTRY#ghcr.io/}"
          fi
          {
            echo "indexer_api_image=${registry}/indexer-api:${content_hash}"
            echo "chain_indexer_image=${registry}/chain-indexer:${content_hash}"
            echo "wallet_indexer_image=${registry}/wallet-indexer:${content_hash}"
            echo "content_hash=${content_hash}"
          } >> "$GITHUB_OUTPUT"

          # Fork PRs can't reuse GHCR images, so they always build.
          if [ "$FORCE_REBUILD" = "true" ] || [ "$IS_FORK_PR" = "true" ]; then
            echo "skip_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          API_EXISTS=$(docker manifest inspect "${GHCR_REGISTRY}/indexer-api:${content_hash}" > /dev/null 2>&1 && echo true || echo false)
          CHAIN_EXISTS=$(docker manifest inspect "${GHCR_REGISTRY}/chain-indexer:${content_hash}" > /dev/null 2>&1 && echo true || echo false)
          WALLET_EXISTS=$(docker manifest inspect "${GHCR_REGISTRY}/wallet-indexer:${content_hash}" > /dev/null 2>&1 && echo true || echo false)

          if [ "$API_EXISTS" = "true" ] && [ "$CHAIN_EXISTS" = "true" ] && [ "$WALLET_EXISTS" = "true" ]; then
            echo "skip_build=true" >> "$GITHUB_OUTPUT"
            echo "Indexer images already exist for ${content_hash}, skipping image build"
          else
            echo "skip_build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Free disk space
        if: needs.scope.outputs.product == 'true' && ((steps.image_meta.outputs.skip_build != 'true' || steps.indexer-tests.outputs.hit != 'true') && runner.environment != 'self-hosted')
        run: scripts/free-disk-space.sh > /tmp/free-disk-space.log 2>&1 &

      - name: Install just
        if: needs.scope.outputs.product == 'true' && (steps.image_meta.outputs.skip_build != 'true' || steps.indexer-tests.outputs.hit != 'true')
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 #v2.90.0
        with:
          tool: just

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 #v2.9.3
        if: needs.scope.outputs.product == 'true' && (steps.indexer-tests.outputs.hit != 'true')
        with:
          workspaces: indexer -> target
          shared-key: indexer-standalone
          cache-on-failure: true

      - name: Build indexer images
        if: needs.scope.outputs.product == 'true' && (steps.image_meta.outputs.skip_build != 'true')
        env:
          INDEXER_API_IMAGE: ${{ steps.image_meta.outputs.indexer_api_image }}
          CHAIN_INDEXER_IMAGE: ${{ steps.image_meta.outputs.chain_indexer_image }}
          WALLET_INDEXER_IMAGE: ${{ steps.image_meta.outputs.wallet_indexer_image }}
        run: |
          mkdir -p "$HOME/.cargo"
          echo "[net]" >> "$HOME/.cargo/config"
          echo "git-fetch-with-cli = true" >> "$HOME/.cargo/config"

          # Force AMD64 architecture for all builds
          export DOCKER_DEFAULT_PLATFORM=linux/amd64
          export DOCKER_BUILDKIT=1
          export BUILDX_PLATFORM=linux/amd64

          cd indexer || exit 1
          . .envrc

          DOCKER_DEFAULT_PLATFORM=linux/amd64 just build-docker-image indexer-api
          DOCKER_DEFAULT_PLATFORM=linux/amd64 just build-docker-image chain-indexer
          DOCKER_DEFAULT_PLATFORM=linux/amd64 just build-docker-image wallet-indexer

          # Retag with the submodule's content hash
          SUBMODULE_COMMIT=$(git rev-parse --short=8 HEAD)

          docker tag "midnightntwrk/indexer-api:${SUBMODULE_COMMIT}" "$INDEXER_API_IMAGE"
          docker tag "midnightntwrk/chain-indexer:${SUBMODULE_COMMIT}" "$CHAIN_INDEXER_IMAGE"
          docker tag "midnightntwrk/wallet-indexer:${SUBMODULE_COMMIT}" "$WALLET_INDEXER_IMAGE"


      - name: Save indexer images for downstream jobs (fork PRs)
        if: needs.scope.outputs.product == 'true' && (steps.image_meta.outputs.skip_build != 'true' && env.IS_FORK_PR == 'true')
        uses: ./.github/actions/save-fork-images # zizmor: ignore[self-repository] actionlint does not yet accept $/
        with:
          artifact-name: fork-images-indexer
          images: |
            ${{ steps.image_meta.outputs.indexer_api_image }}
            ${{ steps.image_meta.outputs.chain_indexer_image }}
            ${{ steps.image_meta.outputs.wallet_indexer_image }}

      # Fork PRs have no token, and an empty one in the rewrite would break public clones.
      - name: Configure git for private repos
        if: needs.scope.outputs.product == 'true' && (steps.indexer-tests.outputs.hit != 'true' && env.IS_FORK_PR != 'true')
        run: |
          git config --global url."https://${GH_PAT}:x-oauth-basic@github.com/".insteadOf "https://github.com/"
        env:
          GH_PAT: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}

      - name: Install cargo-nextest
        if: needs.scope.outputs.product == 'true' && (steps.indexer-tests.outputs.hit != 'true')
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-nextest@0.9.128

      - name: just test
        if: needs.scope.outputs.product == 'true' && (steps.indexer-tests.outputs.hit != 'true')
        env:
          NODE_GIT_TOKEN: ${{ secrets.NODE_GIT_TOKEN }}
          APP__INFRA__SECRET: ${{ secrets.APP__INFRA__SECRET }}
        run: |
          # Fork PRs don't get the secret. The tests only need some 32-byte hex key.
          if [ -z "$APP__INFRA__SECRET" ]; then
            APP__INFRA__SECRET=$(openssl rand -hex 32)
            export APP__INFRA__SECRET
          fi
          . ./.envrc
          git config --global url."https://@github.com".insteadOf "ssh://git@github.com"
          cd indexer || exit 1
          just feature=standalone test

      - uses: ./.github/actions/tree-cache-guard/save
        if: needs.scope.outputs.product == 'true' && (steps.indexer-tests.outputs.hit != 'true')
        with:
          key: ${{ steps.indexer-tests.outputs.key }}

      - name: Publish validated indexer images
        if: needs.scope.outputs.product == 'true' && (steps.image_meta.outputs.skip_build != 'true' && env.IS_FORK_PR != 'true')
        env:
          INDEXER_API_IMAGE: ${{ steps.image_meta.outputs.indexer_api_image }}
          CHAIN_INDEXER_IMAGE: ${{ steps.image_meta.outputs.chain_indexer_image }}
          WALLET_INDEXER_IMAGE: ${{ steps.image_meta.outputs.wallet_indexer_image }}
        run: |
          docker push "$INDEXER_API_IMAGE"
          docker push "$CHAIN_INDEXER_IMAGE"
          docker push "$WALLET_INDEXER_IMAGE"

  local-environment-tests:
    name: Local Environment Tests
    if: ${{ !cancelled() && !failure() && needs.run.result == 'success' && needs.build-indexer-images.result == 'success' && ((github.event_name == 'pull_request' && github.event.pull_request.merged == false) || github.event_name == 'merge_group') }}
    needs: [scope, run, build-indexer-images, prepare-local-e2e]
    # Self-hosted only in our own orgs (other repos have no such runners and would queue
    # forever) and never for fork PRs (keeps untrusted code off our infrastructure).
    runs-on: ${{ needs.scope.outputs.product != 'true' && fromJSON('["ubuntu-24.04"]') || ((contains(fromJSON('["midnightntwrk", "shieldedtech"]'), github.repository_owner) && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && fromJSON('["self-hosted", "tier:medium"]') || fromJSON('["ubuntu-24.04"]')) }}
    # No concurrency group: the local-env stack now runs INSIDE earthly's nested dockerd
    # (+local-env-ci), which gives each invocation its own network namespace. The stack
    # no longer binds fixed host ports (1442/1337/8088/4222/5432/30000/32000/9933-9944),
    # so concurrent PRs on the same self-hosted host can't collide — the repo-wide
    # `local-environment-tests-self-hosted` serialization is gone. Concurrency is now
    # RAM-bounded (the shared buildkit/RAM pool), which earthly queues, not hard-serialized.
    permissions:
      pull-requests: write
      packages: read
      contents: write
      actions: write
    steps:
      - name: Documentation-only check
        if: needs.scope.outputs.product != 'true'
        run: echo 'No product inputs changed; this check is satisfied.'
      - name: Checkout
        if: needs.scope.outputs.product == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          submodules: true

      - id: guard
        if: needs.scope.outputs.product == 'true'
        uses: ./.github/actions/tree-cache-guard
        with:
          hmac-key: ${{ secrets.TREE_GUARD_HMAC }}

      # Isolate docker config per job — see the matching step in the `run` job.
      # This job runs concurrently, so per-job isolation matters: multiple
      # instances log in at once and would otherwise clobber each other's docker
      # auth. Inherited by the composite action's docker login and earthly --pull.
      - name: Isolate docker config
        if: needs.scope.outputs.product == 'true' && (steps.guard.outputs.hit != 'true')
        run: |
          mkdir -p "$RUNNER_TEMP/.docker"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/.docker" >> "$GITHUB_ENV"

      - name: Load images (fork PRs)
        if: needs.scope.outputs.product == 'true' && (steps.guard.outputs.hit != 'true' && env.IS_FORK_PR == 'true')
        uses: ./.github/actions/load-fork-images # zizmor: ignore[self-repository] actionlint does not yet accept $/
        with:
          artifact-pattern: fork-images-*
          registry: ${{ env.FORK_IMAGE_REGISTRY }}

      - name: Deploy and test against local environment
        if: needs.scope.outputs.product == 'true' && (steps.guard.outputs.hit != 'true')
        uses: ./.github/actions/local-environment-tests
        with:
          node-git-token: ${{ secrets.NODE_GIT_TOKEN }}
          tag: CI
          image: ${{ needs.run.outputs.node_image }}:${{ needs.run.outputs.node_image_tag }}
          toolkit-image: ${{ needs.run.outputs.toolkit_image }}:${{ needs.run.outputs.toolkit_image_tag }}
          indexer-api-image: ${{ needs.build-indexer-images.outputs.indexer_api_image }}
          chain-indexer-image: ${{ needs.build-indexer-images.outputs.chain_indexer_image }}
          wallet-indexer-image: ${{ needs.build-indexer-images.outputs.wallet_indexer_image }}
          indexer-tag: unused
          sha: ${{ needs.run.outputs.sha }}
          tests: premerge
          ci-execution: ${{ github.run_id }}-${{ github.run_attempt }}
          ghcr-password: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}
          # Empty on fork PRs → the in-DinD docker login is skipped and public
          # images (postgres, kupo, …) fall back to anonymous, rate-limited pulls.
          dockerhub-username: ${{ secrets.DOCKERHUB_MIDNIGHTNTWRK_USER }}
          dockerhub-password: ${{ secrets.DOCKERHUB_MIDNIGHTNTWRK_TOKEN }}

      # Defensive cleanup of an orphaned local-env stack for this job, so leaked
      # stacks can't accumulate and fill the host disk. Scoped to this job's own
      # compose project so it never touches other jobs on the host. The project
      # name derives from runner-provided env (with RUNNER_NAME as fallback).
      - name: Tear down this job's local-env stack (defensive)
        if: needs.scope.outputs.product == 'true' && (always())
        shell: bash
        run: |
          proj="local-env-r${RUNNER_SLOT:-${RUNNER_NAME##*-}}"
          docker ps -aq --filter "label=com.docker.compose.project=${proj}" \
            | xargs -r docker rm -f || true
          docker volume ls -q --filter "label=com.docker.compose.project=${proj}" \
            | xargs -r docker volume rm -f || true

      - uses: ./.github/actions/tree-cache-guard/save
        if: needs.scope.outputs.product == 'true' && (steps.guard.outputs.hit != 'true')
        with:
          key: ${{ steps.guard.outputs.key }}

