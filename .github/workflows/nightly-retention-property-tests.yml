name: Nightly Retention Property Tests

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

# no top level default permissions for security reasons
permissions:
  contents: read

jobs:
  retention_property_tests:
    name: Retention property tests, long histories
    # The test binary's link needs more memory than ubuntu-latest has, as for +test.
    runs-on: [self-hosted, "tier:large"]
    timeout-minutes: 120
    env:
      FORCE_COLOR: 1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          submodules: true

      - uses: EarthBuild/actions-setup@f4d20223e70dbb43b5fc08c4d857ab9cf0dbf3ae # v2.2.0
        with:
          version: v0.8.18
          github-token: ${{ github.token }}
          use-cache: false

      - name: Run the nightly retention property tests
        env:
          NODE_GIT_TOKEN: ${{ secrets.NODE_GIT_TOKEN }}
        run: |
          . ./.envrc && earth --platform=linux/amd64 +test-retention-nightly
