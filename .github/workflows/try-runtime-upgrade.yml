name: try-runtime upgrade dry-run

on:
  workflow_dispatch:
    inputs:
      preview:
        description: "Dry-run against preview"
        type: boolean
        default: true
      preprod:
        description: "Dry-run against preprod"
        type: boolean
        default: true
      mainnet:
        description: "Dry-run against mainnet"
        type: boolean
        default: true
  # TODO: Remove before merge.
  push:
    branches: [ jacek-try-runtime-subcommand ]

permissions: { }

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dry-run:
    name: Build node and dry-run upgrade
    runs-on: ubuntu-latest-16-core-x64
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      FORCE_COLOR: 1
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true

      - name: Setup Earthly
        uses: EarthBuild/actions-setup@cae2d9ab68894d8402751fe42e07c7cca0272f7f
        with:
          version: v0.8.16
          github-token: ${{ github.token }}
          use-cache: false

      - name: Build node with try-runtime feature
        run: |
          . ./.envrc && earthly -P +try-runtime-build

      - name: Dry-run on-runtime-upgrade - preview
        # TODO: Remove before merge.
        if: ${{ !cancelled() && (github.event_name == 'push' || inputs.preview) }}
        run: |
          . ./.envrc && earthly -P +try-runtime-dry-run-preview

      - name: Dry-run on-runtime-upgrade - preprod
        # TODO: Remove before merge.
        if: ${{ !cancelled() && (github.event_name == 'push' || inputs.preprod) }}
        run: |
          . ./.envrc && earthly -P +try-runtime-dry-run-preprod

      - name: Dry-run on-runtime-upgrade - mainnet
        # TODO: Remove before merge.
        if: ${{ !cancelled() && (github.event_name == 'push' || inputs.mainnet) }}
        run: |
          . ./.envrc && earthly -P +try-runtime-dry-run-mainnet

      - name: Upload snapshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: try-runtime-${{ github.run_id }}
          path: artifacts-try-runtime/
          if-no-files-found: ignore
          retention-days: 14
