name: Validate GitHub Actions Workflows

on:
  merge_group:
  pull_request:
    paths:
      - ".github/workflows/*.yml"
      - ".github/workflows/*.yaml"
      - "Earthfile"
      - "scripts/check-image-revision.sh"
      - "scripts/tests/test_release_image_revision.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/*.yml"
      - ".github/workflows/*.yaml"
      - "Earthfile"
      - "scripts/check-image-revision.sh"
      - "scripts/tests/test_release_image_revision.py"

# no top level default permissions for security reasons
permissions: {}

jobs:
  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest
    # no top level default permissions for security reasons
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test release image revision checks
        run: |
          python3 -m pip install PyYAML==6.0.3
          python3 -m unittest discover -s scripts/tests -p test_release_image_revision.py -v

      - id: guard
        uses: ./.github/actions/tree-cache-guard

      - name: Run actionlint
        if: steps.guard.outputs.hit != 'true'
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2
        with:
          matcher: true # Enable GitHub annotations for errors
          fail-on-error: true # Fail CI when errors are found

      - uses: ./.github/actions/tree-cache-guard/save
        if: steps.guard.outputs.hit != 'true'
        with:
          key: ${{ steps.guard.outputs.key }}
