name: Test - SBOM Trim and Attest

# Temporary workflow to verify that trimmed SBOMs fit under the 16MB
# actions/attest-sbom limit and that attestation succeeds end-to-end.
# Delete this file before merging to main.

on:
  push:
    branches: ["SRE-1910/github-native-attestations"]
    paths: [".github/workflows/test-attestation.yml"]
  workflow_dispatch:

permissions: {}

jobs:
  test-trim-and-attest:
    name: Test SBOM trim + attestation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
        with:
          sparse-checkout: |
            .github/scripts

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: MidnightCI
          password: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@28d71544de8eaf1b958d335707167c5f783590ad # v0.22.2

      - name: Pull image
        run: docker pull ghcr.io/midnight-ntwrk/midnight-node:0.22.0-dev-f26060e9-amd64

      - name: Generate SBOM
        run: |
          syft docker:ghcr.io/midnight-ntwrk/midnight-node:0.22.0-dev-f26060e9-amd64 \
            --select-catalogers '-file' \
            -o spdx-json=sbom.spdx.json
          echo "Full SBOM size: $(wc -c < sbom.spdx.json) bytes"

      - name: Trim SBOM for attestation
        run: |
          source .github/scripts/sbom-scan.sh
          trim_sbom_for_attestation "sbom.spdx.json" "sbom-attestation.spdx.json"

          # Fail if trimmed SBOM still exceeds 16MB
          TRIMMED_SIZE=$(wc -c < sbom-attestation.spdx.json)
          if [ "$TRIMMED_SIZE" -gt 16777216 ]; then
            echo "::error::Trimmed SBOM (${TRIMMED_SIZE} bytes) exceeds 16MB limit"
            exit 1
          fi
          echo "Trimmed SBOM is under 16MB limit - attestation should succeed"

      - name: Get image digest
        id: image-digest
        run: |
          DIGEST=$(docker buildx imagetools inspect ghcr.io/midnight-ntwrk/midnight-node:0.22.0-dev-f26060e9-amd64 --raw | sha256sum | awk '{print "sha256:"$1}')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "subject-name=ghcr.io/midnight-ntwrk/midnight-node" >> "$GITHUB_OUTPUT"

      - name: Attest SBOM
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3.0.0
        with:
          subject-name: ${{ steps.image-digest.outputs.subject-name }}
          subject-digest: ${{ steps.image-digest.outputs.digest }}
          sbom-path: sbom-attestation.spdx.json

      - name: Summary
        run: |
          echo "## SBOM Trim + Attest Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Variant | Size |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---------|------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Full SBOM (no files) | $(wc -c < sbom.spdx.json) bytes |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Trimmed (no relationships) | $(wc -c < sbom-attestation.spdx.json) bytes |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Relationships removed | $(jq '[.relationships // []] | flatten | length' sbom.spdx.json) entries |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "16MB limit = 16,777,216 bytes" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Attestation: **passed**" >> "$GITHUB_STEP_SUMMARY"
