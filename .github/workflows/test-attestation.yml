name: Test - SBOM Size Investigation

# Temporary workflow to measure SBOM size for midnight-node images.
# Checks whether the image SBOM exceeds the 16MB actions/attest-sbom limit.
# Delete this file before merging to main.

on:
  push:
    branches: ["SRE-1910/github-native-attestations"]
    paths: [".github/workflows/test-attestation.yml"]
  workflow_dispatch:

permissions: {}

jobs:
  measure-sbom-size:
    name: Measure SBOM size
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@28d71544de8eaf1b958d335707167c5f783590ad # v0.22.2

      - name: Generate SBOM (default - with file cataloger)
        run: |
          echo "=== SBOM with file cataloger (default) ==="
          syft ghcr.io/midnight-ntwrk/midnight-node:0.22.0-dev-f26060e9-amd64 \
            -o spdx-json=sbom-with-files.json
          ls -lh sbom-with-files.json
          echo "Size in bytes: $(wc -c < sbom-with-files.json)"
          echo "Package count: $(jq '[.packages[] | select(.SPDXID != "SPDXRef-DOCUMENT")] | length' sbom-with-files.json)"
          echo "File count: $(jq '[.files // []] | flatten | length' sbom-with-files.json)"

      - name: Generate SBOM (without file cataloger)
        run: |
          echo "=== SBOM without file cataloger ==="
          syft ghcr.io/midnight-ntwrk/midnight-node:0.22.0-dev-f26060e9-amd64 \
            --select-catalogers '-file' \
            -o spdx-json=sbom-no-files.json
          ls -lh sbom-no-files.json
          echo "Size in bytes: $(wc -c < sbom-no-files.json)"
          echo "Package count: $(jq '[.packages[] | select(.SPDXID != "SPDXRef-DOCUMENT")] | length' sbom-no-files.json)"
          echo "File count: $(jq '[.files // []] | flatten | length' sbom-no-files.json)"

      - name: Generate SBOM (minified JSON)
        run: |
          echo "=== SBOM without file cataloger + minified ==="
          jq -c '.' sbom-no-files.json > sbom-minified.json
          ls -lh sbom-minified.json
          echo "Size in bytes: $(wc -c < sbom-minified.json)"

      - name: Summary
        run: |
          echo "## SBOM Size Comparison" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Variant | Size | Packages | Files |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---------|------|----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Default (with files) | $(ls -lh sbom-with-files.json | awk '{print $5}') | $(jq '[.packages[] | select(.SPDXID != "SPDXRef-DOCUMENT")] | length' sbom-with-files.json) | $(jq '[.files // []] | flatten | length' sbom-with-files.json) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Without file cataloger | $(ls -lh sbom-no-files.json | awk '{print $5}') | $(jq '[.packages[] | select(.SPDXID != "SPDXRef-DOCUMENT")] | length' sbom-no-files.json) | $(jq '[.files // []] | flatten | length' sbom-no-files.json) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Minified JSON | $(ls -lh sbom-minified.json | awk '{print $5}') | - | - |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "16MB limit = 16,777,216 bytes" >> "$GITHUB_STEP_SUMMARY"
