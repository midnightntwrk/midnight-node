name: Rebuild Metadata (Bot Action)

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    push:
    inputs:
      pr_number:
        description: 'PR number to rebuild metadata for'
        required: true

jobs:
  rebuild-metadata:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request && contains(github.event.comment.body, '/rebuild-metadata'))
    runs-on: ubuntu-latest-8-core-x64
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Add reaction to comment
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket'
            })

      - name: Get PR branch
        id: pr
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const prNumber = context.eventName === 'workflow_dispatch'
              ? '${{ github.event.inputs.pr_number }}'
              : context.issue.number;
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            core.setOutput('ref', pr.data.head.ref);
            core.setOutput('sha', pr.data.head.sha);
            core.setOutput('number', prNumber);

      - name: Checkout PR branch
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ steps.pr.outputs.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Earthly
        uses: EarthBuild/actions-setup@cae2d9ab68894d8402751fe42e07c7cca0272f7f
        with:
          version: v0.8.16
          github-token: ${{ github.token }}
          use-cache: false
          allow-privileged: true

      - name: Login to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: MidnightCI
          password: ${{ secrets.MIDNIGHTCI_PACKAGES_READ }}

      - name: Run rebuild-metadata
        run: |
          mkdir -p $HOME/.cargo
          echo "[net]" >> $HOME/.cargo/config
          echo "git-fetch-with-cli = true" >> $HOME/.cargo/config
          . ./.envrc && earthly -P +rebuild-metadata

      - name: Commit and push changes
        run: |
          git config --global user.name "MidnightCI"
          git config --global user.email "ci@midnight.network"
          if [ -n "$(git status --porcelain)" ]; then
            git add metadata/static/
            git commit -m "chore: rebuild metadata"
            git push origin ${{ steps.pr.outputs.ref }}
            echo "CHANGES_MADE=true" >> $GITHUB_ENV
          else
            echo "CHANGES_MADE=false" >> $GITHUB_ENV
          fi

      - name: Post success comment
        if: env.CHANGES_MADE == 'true'
        uses: thollander/actions-comment-pull-request@e2c37e53a7d2227b61585343765f73a9ca57eda9 # v3.0.0
        with:
          message: |
            :white_check_mark: Metadata rebuild complete! Changes have been committed.
          pr-number: ${{ steps.pr.outputs.number }}

      - name: Post no-changes comment
        if: env.CHANGES_MADE == 'false'
        uses: thollander/actions-comment-pull-request@e2c37e53a7d2227b61585343765f73a9ca57eda9 # v3.0.0
        with:
          message: |
            :white_check_mark: Metadata rebuild complete. No changes detected.
          pr-number: ${{ steps.pr.outputs.number }}

      - name: Post failure comment
        if: failure()
        uses: thollander/actions-comment-pull-request@e2c37e53a7d2227b61585343765f73a9ca57eda9 # v3.0.0
        with:
          message: |
            :x: Metadata rebuild failed. Check the [workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.
          pr-number: ${{ steps.pr.outputs.number }}
