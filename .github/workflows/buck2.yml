name: "buck2"

# buck2 build + test on the self-hosted pool, under a bazel-remote action cache
# (Earthfile +buck2-ci -> buck2/Earthfile).
on:
  workflow_dispatch: {}
  # No paths filter: the graph's inputs are all over the tree (every Cargo.toml,
  # every source file), so a filter would only add gaps. PRs get the regen
  # check; build + test is push-only.
  pull_request: {}
  push:
    branches: [main, giles-buck2-build]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The generated graph (third-party + wasm-deps universes, every member's
  # BUCK) must match the cargo workspace: regenerate with the pinned reindeer
  # and fail on any diff, so a Cargo.lock bump that skipped `earth +buck2-regen`
  # cannot build stale crates. A PR from another repository is untrusted code,
  # and a clone outside the org has no fleet: both get a GitHub-hosted runner.
  regen:
    name: buck2 graph matches Cargo.lock
    runs-on: ${{ (contains(fromJSON('["midnightntwrk", "shieldedtech"]'), github.repository_owner) && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && fromJSON('["self-hosted", "tier:large"]') || fromJSON('["ubuntu-latest"]') }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: EarthBuild/actions-setup@f4d20223e70dbb43b5fc08c4d857ab9cf0dbf3ae # v2.2.0
        with:
          version: v0.8.18
          github-token: ${{ github.token }}
          use-cache: false

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the fleet's earth config
        if: runner.environment == 'self-hosted'
        run: echo "EARTH_CONFIG=$GITHUB_WORKSPACE/.earthly/config.selfhosted.yml" >> "$GITHUB_ENV"

      - name: Regenerate and diff
        run: earth --ci +buck2-check-regen

  buck2:
    name: buck2 build + test
    if: github.event_name != 'pull_request' && contains(fromJSON('["midnightntwrk", "shieldedtech"]'), github.repository_owner)
    runs-on: [self-hosted, "tier:large"]
    # A cold buck2 build of the whole tree on one runner is long; the persistent
    # action cache makes later runs warm. Generous cap, but fail rather than hang.
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      # earth v0.8.18, matching the fleet's other earth jobs (continuous-integration*.yml):
      # one earth version across the host is one buildkit settings-hash, so buck2 and the
      # legacy +test jobs share earth-buildkitd and neither docker-rm's the other's daemon
      # mid-build. Global settings here match the provisioned runner buildkitd.
      EARTH_CONFIG: ${{ github.workspace }}/.earthly/config.selfhosted.yml
    steps:
      - uses: EarthBuild/actions-setup@f4d20223e70dbb43b5fc08c4d857ab9cf0dbf3ae # v2.2.0
        with:
          version: v0.8.18
          github-token: ${{ github.token }}
          use-cache: false

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # --RUN_ID re-executes the buck2 steps every run (Earthfile +buck2-ci); the
      # bazel-remote action cache, not Earthly's layer cache, is what keeps them warm.
      # --BUCK2_CACHE_ADDR flows from the runner slot .env (the host-shared
      # bazel-remote the fleet provisions). It is deliberately not in the job's
      # env: a `BUCK2_CACHE_ADDR: ${{ vars.X }}` there would overwrite the slot
      # .env value with empty when the repo var is unset. Unset everywhere ->
      # buck2-ci.sh runs a per-job sidecar on the CACHE mount.
      - name: buck2 build + test
        run: |
          earth --ci +buck2-ci --RUN_ID="$GITHUB_RUN_ID" --BUCK2_CACHE_ADDR="${BUCK2_CACHE_ADDR:-}"
