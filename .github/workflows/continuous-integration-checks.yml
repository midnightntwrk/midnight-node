name: +check (format + lint)

on:
  merge_group:
  pull_request:
    branches: ["**"]
    paths-ignore:
      - "changes/**"
  push:
    branches: ["main"]
# no top level default permissions for security reasons
permissions: {}
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow, github.head_ref) || github.run_id }}
  cancel-in-progress: true
jobs:
  run:
    name: Fomatting and Linting
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    env:
      FORCE_COLOR: 1
    steps:
      - name: Checkout node repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          submodules: true

      - id: guard
        uses: ./.github/actions/tree-cache-guard

      - name: Merge Conflict Finder
        if: steps.guard.outputs.hit != 'true'
        uses: olivernybroe/action-conflict-finder@78f7add155e0bf97e9c71cb0383ef5691f72868c # v4.0

      - name: Login to GHCR
        if: steps.guard.outputs.hit != 'true'
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c #v4.5.2
        with:
          registry: ghcr.io
          username: MidnightCI
          password: ${{ secrets.MIDNIGHTCI_PACKAGES_READ }}

      - uses: EarthBuild/actions-setup@f4d20223e70dbb43b5fc08c4d857ab9cf0dbf3ae # v2.2.0
        if: steps.guard.outputs.hit != 'true'
        with:
          version: v0.8.18
          github-token: ${{ github.token }}
          use-cache: false

      - name: Free disk space
        if: steps.guard.outputs.hit != 'true'
        run: scripts/free-disk-space.sh > /tmp/free-disk-space.log 2>&1 &

      - name: Run build
        if: steps.guard.outputs.hit != 'true'
        run: |
          . ./.envrc && earth --ci +check

      - uses: ./.github/actions/tree-cache-guard/save
        if: steps.guard.outputs.hit != 'true'
        with:
          key: ${{ steps.guard.outputs.key }}

  feature-unification:
    name: Feature Unification Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FORCE_COLOR: 1
    steps:
      - name: Checkout node repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          submodules: true

      - id: guard
        uses: ./.github/actions/tree-cache-guard

      - name: Login to GHCR
        if: steps.guard.outputs.hit != 'true'
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c #v4.5.2
        with:
          registry: ghcr.io
          username: MidnightCI
          password: ${{ secrets.MIDNIGHTCI_PACKAGES_READ }}

      - uses: EarthBuild/actions-setup@f4d20223e70dbb43b5fc08c4d857ab9cf0dbf3ae # v2.2.0
        if: steps.guard.outputs.hit != 'true'
        with:
          version: v0.8.18
          github-token: ${{ github.token }}
          use-cache: false

      - name: Free disk space
        if: steps.guard.outputs.hit != 'true'
        run: scripts/free-disk-space.sh > /tmp/free-disk-space.log 2>&1 &

      - name: Run feature unification check
        if: steps.guard.outputs.hit != 'true'
        run: |
          . ./.envrc && earth --ci +check-feature-unification

      - uses: ./.github/actions/tree-cache-guard/save
        if: steps.guard.outputs.hit != 'true'
        with:
          key: ${{ steps.guard.outputs.key }}
