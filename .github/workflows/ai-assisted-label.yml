name: Label AI-assisted PRs

# Dispatcher — calls the reusable workflow in midnightntwrk/workflows.
# Applies bot:ai-assisted when a PR carries an AI-tooling signature.
#
# Known gap: fork-originated PRs get a read-only token on pull_request, so they
# are never labelled. pull_request_target would fix that and is safe here (the
# reusable never checks out or runs PR code), but zizmor fails the scan gate on
# that trigger unconditionally, so the gap stands pending a security decision.
on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-assisted-label-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    uses: midnightntwrk/workflows/.github/workflows/ai-assisted-label.yml@2a516da4425edff87dd8d080bfb1c4125866f727
