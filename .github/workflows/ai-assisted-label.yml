name: Label AI-assisted PRs

# Dispatcher — calls the reusable workflow in midnightntwrk/workflows.
# Applies bot:ai-assisted when a PR carries an AI-tooling signature.
#
# pull_request_target, not pull_request: GitHub gives fork-originated PRs a
# read-only token regardless of the permissions requested, so labelling them
# would silently fail. Safe here because the reusable never checks out or runs
# PR code — it only reads PR metadata through the API.
on:
  pull_request_target:
    types: [opened, edited, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-assisted-label-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    uses: midnightntwrk/workflows/.github/workflows/ai-assisted-label.yml@2a516da4425edff87dd8d080bfb1c4125866f727
