name: Weekly Clean Build Check

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"

# no top level default permissions for security reasons
permissions:
  contents: read

jobs:
  build_node:
    name: Clean build of main
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      FORCE_COLOR: 1
    outputs:
      node_result: ${{ steps.run_earthly.outputs.node_result }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          submodules: true

      - uses: EarthBuild/actions-setup@f4d20223e70dbb43b5fc08c4d857ab9cf0dbf3ae # v2.2.0
        with:
          version: v0.8.18
          github-token: ${{ github.token }}
          use-cache: false

      - name: Cat the Cargo.toml
        run: cat ./Cargo.toml

      - name: Free disk space
        run: scripts/free-disk-space.sh > /tmp/free-disk-space.log 2>&1 &

      - name: Run check
        env:
          NODE_GIT_TOKEN: ${{ secrets.NODE_GIT_TOKEN }}
        run: |
          . ./.envrc && earth --platform=linux/amd64 +node-image
