name: Validate hosted registry mirrors

on:
  pull_request:
    paths:
      - ".envrc"
      - ".earthly/config.hosted.yml"
      - ".github/actions/configure-docker-mirror/**"
      - ".github/actions/reusable-e2e-tests/**"
      - ".github/workflows/registry-mirror.yml"
  workflow_dispatch:

permissions: {}

jobs:
  mirrors:
    name: Hosted Docker and BuildKit mirrors
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false

      - name: Check runner configuration selection
        shell: bash
        run: |
          for environment in github-hosted self-hosted unknown; do
            case "$environment" in
              github-hosted) expected="$PWD/.earthly/config.hosted.yml" ;;
              self-hosted) expected="$PWD/.earthly/config.selfhosted.yml" ;;
              *) expected="$PWD/.earthly/config.yml" ;;
            esac
            actual=$(RUNNER_ENVIRONMENT="$environment" bash -c '. ./.envrc >/dev/null; printf "%s" "$EARTHLY_CONFIG"')
            test "$actual" = "$expected"
          done

      - name: Capture Docker and container state
        id: before
        shell: bash
        run: |
          sudo mkdir -p /etc/docker
          if ! sudo test -f /etc/docker/daemon.json; then
            echo '{}' | sudo tee /etc/docker/daemon.json >/dev/null
          fi
          sudo chmod 0640 /etc/docker/daemon.json
          docker run -d --name mirror-reload-smoke busybox:1.35.0-uclibc@sha256:e5877866756a3714cd11309f0b34e7c2c62406fdbfcae39c96beabb5dd4005a7 sleep 300
          echo "docker_pid=$(systemctl show docker.service --property=MainPID --value)" >> "$GITHUB_OUTPUT"
          echo "container_pid=$(docker inspect --format '{{.State.Pid}}' mirror-reload-smoke)" >> "$GITHUB_OUTPUT"
          echo "config_meta=$(sudo stat -c '%a:%u:%g' /etc/docker/daemon.json)" >> "$GITHUB_OUTPUT"
          echo "unrelated_sha=$(sudo jq -cS 'del(.["registry-mirrors"])' /etc/docker/daemon.json | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Configure host mirror
        uses: ./.github/actions/configure-docker-mirror

      - name: Verify reload preserves running state and configuration
        id: applied
        env:
          INITIAL_DOCKER_PID: ${{ steps.before.outputs.docker_pid }}
          INITIAL_CONTAINER_PID: ${{ steps.before.outputs.container_pid }}
          INITIAL_CONFIG_META: ${{ steps.before.outputs.config_meta }}
          INITIAL_UNRELATED_SHA: ${{ steps.before.outputs.unrelated_sha }}
        shell: bash
        run: |
          test "$INITIAL_DOCKER_PID" = "$(systemctl show docker.service --property=MainPID --value)"
          test "$INITIAL_CONTAINER_PID" = "$(docker inspect --format '{{.State.Pid}}' mirror-reload-smoke)"
          test "$(docker inspect --format '{{.State.Running}}' mirror-reload-smoke)" = true
          test "$INITIAL_CONFIG_META" = "$(sudo stat -c '%a:%u:%g' /etc/docker/daemon.json)"
          test "$INITIAL_UNRELATED_SHA" = "$(sudo jq -cS 'del(.["registry-mirrors"])' /etc/docker/daemon.json | sha256sum | cut -d' ' -f1)"
          echo "inode=$(sudo stat -c '%i' /etc/docker/daemon.json)" >> "$GITHUB_OUTPUT"
          echo 'Docker PID, container PID, permissions and unrelated settings preserved'

      - name: Reapply host mirror
        uses: ./.github/actions/configure-docker-mirror

      - name: Verify idempotence
        env:
          APPLIED_INODE: ${{ steps.applied.outputs.inode }}
        run: test "$APPLIED_INODE" = "$(sudo stat -c '%i' /etc/docker/daemon.json)"

      - name: Remove smoke container
        if: always()
        run: docker rm -f mirror-reload-smoke >/dev/null 2>&1 || true

      - name: Pull a distinct pinned public image through hosted Docker
        run: docker pull alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc

      - name: Install pinned EarthBuild client
        uses: EarthBuild/actions-setup@f4d20223e70dbb43b5fc08c4d857ab9cf0dbf3ae #v2.2.0
        with:
          version: v0.8.18
          github-token: ${{ github.token }}
          use-cache: false

      - name: Verify BuildKit mirror and Hub fallback
        shell: bash
        run: |
          set -euo pipefail
          probe_root=$(mktemp -d)
          repository=$PWD
          cleanup() {
            for installation in earth-mirror-probe earth-mirror-fallback; do
              docker rm -f "${installation}-buildkitd" >/dev/null 2>&1 || true
              docker volume rm "${installation}-cache" >/dev/null 2>&1 || true
            done
          }
          trap cleanup EXIT
          for mode in probe fallback; do
            installation="earth-mirror-$mode"
            directory="$probe_root/$mode"
            mkdir -p "$directory/docker"
            echo '{}' > "$directory/docker/config.json"
            printf '%s\n' 'VERSION 0.8' 'probe:' \
              '    FROM busybox:1.35.0-uclibc@sha256:e5877866756a3714cd11309f0b34e7c2c62406fdbfcae39c96beabb5dd4005a7' \
              '    RUN echo registry-probe-ok' > "$directory/Earthfile"
            cp "$repository/.earthly/config.hosted.yml" "$directory/config.yml"
            port=8391
            if [[ "$mode" == fallback ]]; then
              sed -i 's|"mirror.gcr.io"|"mirror.gcr.io/midnight-mirror-probe-missing"|' "$directory/config.yml"
              port=8392
            fi
            printf '%s\n' '    tls_enabled: false' '    buildkit_additional_args: ["-m", "4Gb"]' \
              "    local_registry_host: \"tcp://127.0.0.1:$port\"" >> "$directory/config.yml"
            (
              cd "$directory"
              env -u GITHUB_TOKEN -u GH_TOKEN -u NODE_GIT_TOKEN -u EARTHLY_TOKEN -u EARTH_TOKEN \
                -u DOCKER_AUTH_CONFIG -u EARTHLY_BUILD_ARGS DOCKER_CONFIG="$directory/docker" \
                earth --debug --no-output --installation-name "$installation" --config "$directory/config.yml" +probe
            )
            # Emit artifact URLs and status codes only; raw headers and URL queries may contain credentials.
            docker logs "${installation}-buildkitd" 2>&1 | awk '
              /response.status=/ {
                if (!match($0, /response\.status="?[0-9][0-9][0-9]/)) next
                status = substr($0, RSTART, RLENGTH)
                sub(/^response\.status="?/, "", status)
                if (!match($0, /url="?https?:\/\/(mirror\.gcr\.io|registry-1\.docker\.io|registry\.hub\.docker\.com)\/[^ "?]+/)) next
                url = substr($0, RSTART, RLENGTH)
                sub(/^url="?/, "", url)
                if (url ~ /\/busybox\/(manifests|blobs)\//) print status, url
              }
            ' > "$directory/proof"
            cat "$directory/proof"
            if [[ "$mode" == fallback ]]; then
              grep -Eq '^[45][0-9]{2} https://mirror\.gcr\.io/.*midnight-mirror-probe-missing/.*/busybox/manifests/' "$directory/proof"
              grep -Eq '^2[0-9]{2} https://registry-1\.docker\.io/.*/busybox/manifests/' "$directory/proof"
            else
              grep -Eq '^2[0-9]{2} https://mirror\.gcr\.io/.*/busybox/(manifests|blobs)/' "$directory/proof"
            fi
          done
