name: fork-devnet

# Stand up a locally-forked devnet from a snapshot, with validator keys and
# on-chain authority storage replaced by mock-authorities' deterministic set,
# and the node's built-in mock main chain follower serving all Cardano-derived
# data. No Cardano db-sync, no secrets, no external infra.

on:
  workflow_dispatch:
    inputs:
      mock_authorities_tag:
        description: "mock-authorities image tag"
        required: true
        default: "47fe424"
      node_image:
        description: "midnight-node image (must be compatible with the snapshot's runtime)"
        required: true
  # TODO: remove before merging — temporary trigger so we can iterate on this
  # workflow on the branch before it lands on the default branch (which is
  # required for workflow_dispatch to be available in the UI).
  push:
    branches:
      - local-env-fork-ci

permissions:
  contents: read
  packages: read

concurrency:
  group: fork-devnet-${{ github.ref }}
  cancel-in-progress: true

env:
  NUM_VALIDATORS: "6"
  CHAIN_ID: "midnight_devnet"
  DEVNET_DIR: "local-environment/src/networks/well-known/devnet"
  MOCK_AUTHORITIES_IMAGE: "ghcr.io/shieldedtech/mock-authorities:${{ inputs.mock_authorities_tag || '47fe424' }}"
  NODE_IMAGE: ${{ inputs.node_image || 'ghcr.io/midnight-ntwrk/midnight-node:1.0.0-b02cda1bbca9-amd64' }}

jobs:
  fork:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Login to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: MidnightCI
          password: ${{ secrets.MIDNIGHTCI_PACKAGES_READ }}

      - name: Pull images
        run: |
          # Fall back to a local copy if pull fails — lets us test locally-built
          # images (e.g. act) without a remote push.
          docker pull "$MOCK_AUTHORITIES_IMAGE" || docker image inspect "$MOCK_AUTHORITIES_IMAGE" >/dev/null
          docker pull "$NODE_IMAGE" || docker image inspect "$NODE_IMAGE" >/dev/null

      # Pinned to a known-good devnet snapshot for now. The backup system also
      # publishes a manifest at https://dg39snjayoq3t.cloudfront.net/index.json;
      # we may want to add selection logic (e.g. max block_height, version filter)
      # later so this doesn't go stale as snapshots rotate out of S3.
      - name: Download snapshot
        env:
          SNAPSHOT_URL: "https://dg39snjayoq3t.cloudfront.net/devnet/ip-10-0-47-151/epoch-0/devnet-epoch-0-block-250208-v0.22.0.tar.gz"
        run: |
          curl -fL --retry 3 --retry-delay 5 -o /tmp/devnet-snapshot.tar "$SNAPSHOT_URL"
          ls -lh /tmp/devnet-snapshot.tar

      - name: Restore snapshot into each node folder
        run: |
          cd "$DEVNET_DIR"
          for i in $(seq 1 "$NUM_VALIDATORS"); do
            mkdir -p "data/node-$i"
            # Snapshot tar has a single top-level `node/` dir; strip it so paths
            # become data/node-$i/chains/$CHAIN_ID/...
            tar -xf /tmp/devnet-snapshot.tar -C "data/node-$i" --strip-components=1
          done
          find "data/node-1/chains/$CHAIN_ID/paritydb/full" -maxdepth 1 -mindepth 1 | head -3

      - name: Run mock-authorities convert
        run: |
          cd "$DEVNET_DIR"
          mkdir -p mocked-config
          docker run --rm \
            -v "$PWD/data:/data" \
            -v "$PWD/mocked-config:/out" \
            "$MOCK_AUTHORITIES_IMAGE" \
            convert \
              --data-dir /data \
              --chain-id "$CHAIN_ID" \
              --num-validators "$NUM_VALIDATORS" \
              --output-dir /out
          test -f mocked-config/mock-registrations.json
          ls mocked-config/seeds

      - name: Place mock registrations where the node expects them
        run: |
          cd "$DEVNET_DIR"
          mkdir -p res/mock-bridge-data
          cp mocked-config/mock-registrations.json res/mock-bridge-data/devnet-mock.json

      - name: Generate mock-mode compose override
        run: |
          cd "$DEVNET_DIR"
          # Heredocs break the outer YAML block-scalar indent (body lines dedent
          # below the step's run: | indent and terminate the scalar early), so
          # we emit each line with echo.
          {
            echo "services:"
            for i in $(seq 1 "$NUM_VALIDATORS"); do
              vidx=$((i - 1))
              echo "  node${i}:"
              echo "    environment:"
              echo "      USE_MAIN_CHAIN_FOLLOWER_MOCK: \"true\""
              echo "      MOCK_REGISTRATIONS_FILE: \"/res/mock-bridge-data/devnet-mock.json\""
              echo "      AURA_SEED_FILE: /seeds/aura.seed"
              echo "      GRANDPA_SEED_FILE: /seeds/grandpa.seed"
              echo "      CROSS_CHAIN_SEED_FILE: /seeds/cross_chain.seed"
              echo "      SEED_PHRASE: \"\""
              echo "      DB_SYNC_POSTGRES_CONNECTION_STRING: \"\""
              echo "    volumes:"
              echo "      - ./mocked-config/seeds/validator-${vidx}:/seeds"
              # The base compose's x-node-common anchor mount ./res:/res is
              # overridden by each service's own volumes list. Overlay just
              # devnet-mock.json into the image's baked-in /res so we keep
              # chain-spec and the other res files intact.
              echo "      - ./res/mock-bridge-data/devnet-mock.json:/res/mock-bridge-data/devnet-mock.json:ro"
            done
          } > devnet.mock.override.yaml
          cat devnet.mock.override.yaml

      - name: Start the forked network
        run: |
          cd "$DEVNET_DIR"
          docker compose \
            -f devnet.network.yaml \
            -f devnet.mock.override.yaml \
            up -d
          docker compose -f devnet.network.yaml ps

      - name: Wait for block + finality progression
        timeout-minutes: 10
        env:
          RPC_URL: "http://localhost:9950"
          REQUIRED_BLOCKS: "5"
        run: |
          get_tip() {
            curl -sf -H 'Content-Type: application/json' \
              -d '{"jsonrpc":"2.0","id":1,"method":"chain_getHeader","params":[]}' \
              "$RPC_URL" \
              | jq -r '.result.number // empty'
          }
          get_final() {
            curl -sf -H 'Content-Type: application/json' \
              -d '{"jsonrpc":"2.0","id":1,"method":"chain_getFinalizedHead","params":[]}' \
              "$RPC_URL" \
              | jq -r '.result // empty'
          }

          echo "Waiting for RPC to come up..."
          for _ in $(seq 1 60); do
            if tip_hex=$(get_tip) && [ -n "$tip_hex" ]; then
              echo "RPC up. Starting tip: $tip_hex"
              break
            fi
            sleep 5
          done
          [ -n "$tip_hex" ] || { echo "RPC never came up"; exit 1; }

          start_tip=$((16#${tip_hex#0x}))
          start_final=$(get_final)
          echo "Starting block: $start_tip, finalized head: $start_final"

          deadline=$((SECONDS + 480))
          while [ $SECONDS -lt $deadline ]; do
            cur_hex=$(get_tip || true)
            cur_final=$(get_final || true)
            if [ -n "$cur_hex" ]; then
              cur_tip=$((16#${cur_hex#0x}))
              advanced=$((cur_tip - start_tip))
              final_changed="no"
              [ -n "$cur_final" ] && [ "$cur_final" != "$start_final" ] && final_changed="yes"
              echo "tip=$cur_tip (+$advanced) finalized=$cur_final changed=$final_changed"
              if [ $advanced -ge $REQUIRED_BLOCKS ] && [ "$final_changed" = "yes" ]; then
                echo "Chain is producing and finalizing blocks."
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Chain failed to advance $REQUIRED_BLOCKS blocks with finality change in time"
          exit 1

      - name: Dump compose logs
        if: always()
        run: |
          cd "$DEVNET_DIR"
          mkdir -p /tmp/forked-devnet-logs
          docker compose -f devnet.network.yaml logs --no-color \
            > /tmp/forked-devnet-logs/compose.log || true
          docker compose -f devnet.network.yaml ps \
            > /tmp/forked-devnet-logs/ps.txt || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: forked-devnet-logs
          path: /tmp/forked-devnet-logs/
          if-no-files-found: warn

      - name: Tear down
        if: always()
        run: |
          cd "$DEVNET_DIR"
          docker compose -f devnet.network.yaml down -v || true
