name: nightly runs

on:
  # Debug trigger: runs on every push to the specified test branch
  push:
    branches:
      - e2e-cnight-nightly-run

  # Scheduled trigger: only runs from the default branch (e.g. main)
  schedule:
    - cron: "10 * * * *"

  # Manual trigger: can be run from UI on any branch
  workflow_dispatch:
    inputs:
      env:
        description: "Target environment (maps to Rust feature flag)"
        required: true
        default: "qanet"
        type: choice
        options:
          - qanet
          - staging
          - prod
      e2e_ref:
        description: "Git ref to checkout for e2e tests (branch / tag / SHA)"
        required: true
        default: "e2e-cngd-for-cardano-preview"
      notify_slack:
        description: "Send Slack notification"
        required: true
        default: "true"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

concurrency:
  # Prevent overlapping runs for the same environment on the same ref
  group: nightly-e2e-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  rust_e2e:
    runs-on: ubuntu-latest-8-core-x64
    timeout-minutes: 120

    steps:
      - name: Resolve runtime settings
        id: vars
        shell: bash
        run: |
          # schedule does not support inputs, so set defaults for cron runs
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "env=qanet" >> "$GITHUB_OUTPUT"
            echo "e2e_ref=e2e-cngd-for-cardano-preview" >> "$GITHUB_OUTPUT"
            echo "notify_slack=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # push does not support inputs either, so set defaults for push-based debug runs
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "env=qanet" >> "$GITHUB_OUTPUT"
            echo "e2e_ref=e2e-cngd-for-cardano-preview" >> "$GITHUB_OUTPUT"
            echo "notify_slack=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # workflow_dispatch uses user-provided inputs
          echo "env=${{ inputs.env }}" >> "$GITHUB_OUTPUT"
          echo "e2e_ref=${{ inputs.e2e_ref }}" >> "$GITHUB_OUTPUT"
          echo "notify_slack=${{ inputs.notify_slack }}" >> "$GITHUB_OUTPUT"

      - name: Checkout e2e branch
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          ref: ${{ steps.vars.outputs.e2e_ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable

      - name: Install system dependencies (protoc)
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          protoc --version

      - name: Run e2e tests
        working-directory: tests/e2e/tests
        env:
          RUST_BACKTRACE: "1"
        run: |
          cargo test --test e2e_tests --no-default-features --features ${{ steps.vars.outputs.env }} -- \
            register_for_dust_production --no-capture

      - name: Notify Slack
        if: always() && steps.vars.outputs.notify_slack == 'true'
        env:
          SLACK_WEBHOOK_E2E_NODE: ${{ secrets.SLACK_WEBHOOK_E2E_NODE }}
          STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ENV_NAME: ${{ steps.vars.outputs.env }}
          E2E_REF: ${{ steps.vars.outputs.e2e_ref }}
        shell: bash
        run: |
          if [ "$STATUS" = "success" ]; then
            MESSAGE="✅ Nightly ${ENV_NAME} rust e2e PASSED (ref: ${E2E_REF})\n${RUN_URL}"
          else
            MESSAGE="❌ Nightly ${ENV_NAME} rust e2e FAILED (ref: ${E2E_REF})\n${RUN_URL}"
          fi

          curl -X POST -H "Content-type: application/json" \
            --data "{\"text\":\"$MESSAGE\"}" \
            "$SLACK_WEBHOOK_E2E_NODE"