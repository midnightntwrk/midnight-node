name: nightly ledger tests

# The transaction validation cache's generated-tree properties, too slow for per-PR CI.
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-ledger-tests-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  ledger-nightly-tests:
    name: Ledger nightly tests
    runs-on: [ self-hosted, "tier:large" ]
    timeout-minutes: 180
    env:
      FORCE_COLOR: 1
    steps:
      - name: Checkout node repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - uses: EarthBuild/actions-setup@f4d20223e70dbb43b5fc08c4d857ab9cf0dbf3ae # v2.2.0
        with:
          version: v0.8.18
          github-token: ${{ github.token }}
          use-cache: false

      - name: Run nightly ledger tests
        env:
          NODE_GIT_TOKEN: ${{ secrets.NODE_GIT_TOKEN }}
        run: |
          . ./.envrc && earth --strict +test-ledger-nightly --CACHE_KEY=nightly-ledger-tests
