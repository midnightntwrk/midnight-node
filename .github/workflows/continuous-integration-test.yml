name: +test

on:
  merge_group:
  pull_request:
    branches: ["**"]
    paths-ignore:
      - "changes/**"
  push:
    branches: ["main"]
# no top level default permissions for security reasons
permissions: {}
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow, github.head_ref) || github.run_id }}
  cancel-in-progress: true
jobs:
  run:
    name: Run tests
    # 16 core machines seem to have gone walkabout.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    env:
      FORCE_COLOR: 1
    steps:
      - name: Checkout node repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - id: guard
        uses: ./.github/actions/tree-cache-guard

      - uses: EarthBuild/actions-setup@cae2d9ab68894d8402751fe42e07c7cca0272f7f
        if: steps.guard.outputs.hit != 'true'
        with:
          version: v0.8.16
          github-token: ${{ github.token }}
          use-cache: false

      - name: Free disk space
        if: steps.guard.outputs.hit != 'true'
        run: scripts/free-disk-space.sh

      - name: Run build
        if: steps.guard.outputs.hit != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.MIDNIGHTCI_PACKAGES_READ }}
        run: |
          . ./.envrc && earthly --secret GITHUB_TOKEN="$GITHUB_TOKEN" --strict +test

      - name: Upload test report artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: (success() || failure()) && steps.guard.outputs.hit != 'true'
        with:
          name: Test Report
          path: test-artifacts/html

      - name: Upload lcov test report artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: (success() || failure()) && steps.guard.outputs.hit != 'true'
        with:
          name: Lcov Coverage Report
          path: test-artifacts/tests.lcov

      - uses: ./.github/actions/tree-cache-guard/save
        if: steps.guard.outputs.hit != 'true'
        with:
          key: ${{ steps.guard.outputs.key }}
