name: +test

on:
  merge_group:
  pull_request:
    branches: ["**"]
  push:
    branches: ["main"]
env:
  CI_CACHE_TRUSTED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
  # Registry the images this workflow touches live in. Derived from the repo owner so a fork
  # or private clone never reads from or writes to midnightntwrk's registries. Upstream's
  # private GHCR namespace is hyphenated (midnight-ntwrk) while the org login is not, so the
  # canonical branch has to name the repo explicitly rather than derive it.
  # The cache tag lives in the public mirror namespace upstream; a fork keeps it in its own.
  GHCR_REGISTRY_PUBLIC: ${{ github.repository == 'midnightntwrk/midnight-node' && 'ghcr.io/midnightntwrk' || format('ghcr.io/{0}', github.repository_owner) }}

# no top level default permissions for security reasons
permissions: {}
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow, github.head_ref) || github.run_id }}
  cancel-in-progress: true
jobs:
  scope:
    name: Classify changed inputs
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      product: ${{ steps.scope.outputs.product }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        run: python3 scripts/ci/scope.py

  run:
    needs: [scope]
    name: Run tests
    # Fork PRs run on ubuntu-latest, not the self-hosted pool: untrusted PR code is kept
    # off our own infrastructure. Same-repo PRs and push/merge_group keep self-hosted.
    # (This job is also skipped on fork PRs by its step guards; the routing is belt-and-braces.)
    runs-on: ${{ needs.scope.outputs.product != 'true' && fromJSON('["ubuntu-24.04"]') || ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && fromJSON('["ubuntu-24.04"]') || fromJSON('["self-hosted", "tier:large"]')) }}
    permissions:
      contents: read
      packages: write
      actions: write
    env:
      FORCE_COLOR: 1
    steps:
      - name: Documentation-only check
        if: needs.scope.outputs.product != 'true'
        run: echo 'No product inputs changed; this check is satisfied.'
      - name: Checkout node repository
        if: needs.scope.outputs.product == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - id: guard
        if: needs.scope.outputs.product == 'true'
        uses: ./.github/actions/tree-cache-guard
        with:
          hmac-key: ${{ secrets.TREE_GUARD_HMAC }}

      - uses: EarthBuild/actions-setup@f4d20223e70dbb43b5fc08c4d857ab9cf0dbf3ae # v2.2.0
        if: needs.scope.outputs.product == 'true' && (steps.guard.outputs.hit != 'true')
        with:
          version: v0.8.18
          github-token: ${{ github.token }}
          use-cache: false

      - name: Free disk space
        if: needs.scope.outputs.product == 'true' && (steps.guard.outputs.hit != 'true' && runner.environment != 'self-hosted')
        run: scripts/free-disk-space.sh > /tmp/free-disk-space.log 2>&1 &

      - name: Log in to GHCR (for remote cache)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f #v4.6.0
        if: needs.scope.outputs.product == 'true' && ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && steps.guard.outputs.hit != 'true')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Authenticate to Docker Hub on internal PRs / pushes to avoid the unauthenticated
      # pull rate limit when WITH DOCKER pulls images like postgres for testcontainers.
      # Skipped on fork PRs where these secrets are not available.
      # If for some reason we can't log in we should proceed unauthed.
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f #v4.6.0
        continue-on-error: true
        if: needs.scope.outputs.product == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          username: ${{ secrets.DOCKERHUB_MIDNIGHTNTWRK_USER }}
          password: ${{ secrets.DOCKERHUB_MIDNIGHTNTWRK_TOKEN }}

      - name: Run build
        if: needs.scope.outputs.product == 'true' && (steps.guard.outputs.hit != 'true')
        env:
          NODE_GIT_TOKEN: ${{ secrets.NODE_GIT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.MIDNIGHTCI_PACKAGES_READ }}
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_MIDNIGHTNTWRK_USER }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_MIDNIGHTNTWRK_TOKEN }}
          GH_REF_FOR_BUILD: ${{ github.ref }}
        run: |
          PUSH_FLAG=""
          if [ "$GH_REF_FOR_BUILD" = "refs/heads/main" ]; then
            PUSH_FLAG="--push"
          fi
          . ./.envrc && earth -P \
            --secret GITHUB_TOKEN="$GITHUB_TOKEN" \
            --secret DOCKERHUB_USER="$DOCKERHUB_USER" \
            --secret DOCKERHUB_TOKEN="$DOCKERHUB_TOKEN" \
            --strict $PUSH_FLAG \
            --remote-cache="${GHCR_REGISTRY_PUBLIC}/${GITHUB_REPOSITORY#*/}:cache-test" \
            +test

      - name: Upload JUnit test report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.scope.outputs.product == 'true' && ((success() || failure()) && steps.guard.outputs.hit != 'true')
        with:
          name: Core Test Results
          path: test-artifacts/core-junit.xml
          if-no-files-found: warn

      - uses: ./.github/actions/tree-cache-guard/save
        if: needs.scope.outputs.product == 'true' && (steps.guard.outputs.hit != 'true')
        with:
          key: ${{ steps.guard.outputs.key }}
