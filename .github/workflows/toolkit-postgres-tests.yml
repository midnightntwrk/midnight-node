name: Toolkit PostgreSQL Tests

on:
  merge_group:
  pull_request:
    branches: ["**"]
    paths:
      - "util/toolkit/**"
      - ".github/workflows/toolkit-postgres-tests.yml"
  push:
    branches: ["main"]
    paths:
      - "util/toolkit/**"

# Restrict permissions for security
permissions: {}

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow, github.head_ref) || github.run_id }}
  cancel-in-progress: true

jobs:
  postgres-tests:
    name: Run PostgreSQL integration tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:15@sha256:5f07e69ced9ee30ec814cd12c555694276bb1d520e971205f39a833362748a3c
        env:
          # Ephemeral CI test container credentials - not a production secret
          POSTGRES_PASSWORD: ${{ vars.CI_TEST_DB_PASSWORD || 'postgres' }}
          POSTGRES_USER: postgres
          POSTGRES_DB: toolkit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure git for private repos
        run: |
          git config --global url."https://${GH_PAT}:x-oauth-basic@github.com/".insteadOf "https://github.com/"
        env:
          GH_PAT: ${{ secrets.MIDNIGHTCI_PACKAGES_READ }}

      - name: Setup Rust toolchain
        run: |
          # Download and verify rustup installer
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o rustup-init.sh
          # Install with pinned toolchain version from rust-toolchain.toml
          sh rustup-init.sh -y --default-toolchain none
          rm rustup-init.sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          mkdir -p $HOME/.cargo
          echo "[net]" >> $HOME/.cargo/config
          echo "git-fetch-with-cli = true" >> $HOME/.cargo/config

      - name: Run PostgreSQL integration tests
        env:
          PGUSER: postgres
          # Ephemeral CI test container credentials - not a production secret
          PGPASSWORD: ${{ vars.CI_TEST_DB_PASSWORD || 'postgres' }}
          PGHOST: localhost
          PGPORT: "5432"
          PGDATABASE: toolkit_test
        run: |
          export TOOLKIT_TEST_POSTGRES_URL="postgres://${PGUSER}:${PGPASSWORD}@${PGHOST}:${PGPORT}/${PGDATABASE}"
          cargo test --package midnight-node-toolkit --release postgres_backend::tests -- --ignored --test-threads=1
