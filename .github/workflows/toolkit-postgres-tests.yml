name: Toolkit PostgreSQL Tests

on:
  merge_group:
  pull_request:
    branches: ["**"]
    paths:
      - "util/toolkit/**"
      - ".github/workflows/toolkit-postgres-tests.yml"
  push:
    branches: ["main"]
    paths:
      - "util/toolkit/**"

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow, github.head_ref) || github.run_id }}
  cancel-in-progress: true

jobs:
  postgres-tests:
    name: Run PostgreSQL integration tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          # kics-scan ignore-line - ephemeral CI test container, not a production secret
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: toolkit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4.0.0

      - name: Configure git for private repos
        run: |
          git config --global url."https://${GH_PAT}:x-oauth-basic@github.com/".insteadOf "https://github.com/"
        env:
          GH_PAT: ${{ secrets.MIDNIGHTCI_PACKAGES_READ }}

      - name: Setup Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.90
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          echo "[net]" >> $HOME/.cargo/config
          echo "git-fetch-with-cli = true" >> $HOME/.cargo/config

      - name: Run PostgreSQL integration tests
        env:
          PGUSER: postgres
          # kics-scan ignore-line - ephemeral CI test container, not a production secret
          PGPASSWORD: postgres
          PGHOST: localhost
          PGPORT: "5432"
          PGDATABASE: toolkit_test
        run: |
          export TOOLKIT_TEST_POSTGRES_URL="postgres://${PGUSER}:${PGPASSWORD}@${PGHOST}:${PGPORT}/${PGDATABASE}"
          cargo test --package midnight-node-toolkit --release postgres_backend::tests -- --ignored --test-threads=1
