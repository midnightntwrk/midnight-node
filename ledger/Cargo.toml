[package]
name = "midnight-node-ledger"
version = "0.1.0"
edition = "2024"
license-file.workspace = true

[dependencies]
base-crypto = { workspace = true, optional = true }
coin-structure = { workspace = true, optional = true }
midnight-serialize = { workspace = true, optional = true }
midnight-storage-core = { workspace = true, optional = true }
parity-db = { workspace = true, optional = true }
transient-crypto = { workspace = true, optional = true }

mn-ledger-8 = { workspace = true, features = ["proving"], optional = true }
onchain-runtime-ledger-8 = { workspace = true, optional = true }
onchain-state-ledger-8 = { workspace = true, optional = true }
ledger-storage-ledger-8 = { workspace = true, optional = true }
zswap-ledger-8 = { workspace = true, optional = true }

mn-ledger-9 = { workspace = true, features = ["proving"], optional = true }
onchain-runtime-ledger-9 = { workspace = true, optional = true }
onchain-state-ledger-9 = { workspace = true, optional = true }
zswap-ledger-9 = { workspace = true, optional = true }
coin-structure-ledger-9 = { workspace = true, optional = true }
transient-crypto-ledger-9 = { workspace = true, optional = true }

# v8->v9 state translation table, driven by `host_api::migration_8_to_9` (std-only).
v8-to-v9-state-translation = { workspace = true, optional = true }

sp-runtime-interface.workspace = true
sp-runtime.workspace = true
sp-externalities.workspace = true
sp-tracing.workspace = true
parity-scale-codec = { workspace = true, features = ["derive", "max-encoded-len"] }
scale-info-derive.workspace = true
frame-support = { workspace = true, default-features = false }
midnight-primitives-ledger = { workspace = true, optional = true }
derive-where = { workspace = true, optional = true }

serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
log = { workspace = true, optional = true }
lazy_static = { workspace = true, optional = true }
moka = { version = "0.11.3", optional = true }
sha2 = { workspace = true, optional = true }
midnight-node-ledger-helpers = { workspace = true, optional = true }
scale-info.workspace = true

[dev-dependencies]
midnight-node-res = { workspace = true, features = ["test", "chain-spec"] }
# The crate's own `#[cfg(test)]` modules (api::ledger, api::transaction, and the
# state-translation tests) use `extract_tx_with_context`, gated behind the
# helpers `can-panic` feature. Enable it for test builds so the tests compile
# when the crate is tested standalone.
midnight-node-ledger-helpers = { workspace = true, features = ["can-panic", "test-utils"] }

[features]
default = [
    "std",
    "test-utils"
]
std = [
    "sp-runtime-interface/std",
    "sp-runtime/std",
    "sp-externalities/std",
    "midnight-primitives-ledger/std",
    "parity-scale-codec/std",
    "scale-info/std",
    "frame-support/std",
    "serde/std",
    "serde_json",
    "hex",
    "log",
    "lazy_static",
    "moka",
    "base-crypto",
    "coin-structure",
    "midnight-serialize",
    "midnight-storage-core",
    "parity-db",
    "transient-crypto",
    "mn-ledger-8",
    "onchain-runtime-ledger-8",
    "onchain-state-ledger-8",
    "ledger-storage-ledger-8",
    "zswap-ledger-8",
    "mn-ledger-9",
    "onchain-runtime-ledger-9",
    "onchain-state-ledger-9",
    "zswap-ledger-9",
    "coin-structure-ledger-9",
    "transient-crypto-ledger-9",
    "v8-to-v9-state-translation",
    "sha2",
    "midnight-node-ledger-helpers",
    "derive-where"
]
runtime-benchmarks = []
test-utils = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(substrate_runtime)'] }
