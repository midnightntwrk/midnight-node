[package]
name = "midnight-node-ledger"
version = "0.1.0"
edition = "2024"
license-file.workspace = true

[dependencies]
base-crypto = { workspace = true, optional = true }
midnight-serialize = { workspace = true, optional = true }
midnight-storage-core = { workspace = true, optional = true }
parity-db = { workspace = true, optional = true }
transient-crypto = { workspace = true, optional = true }



mn-ledger-10 = { workspace = true, features = ["proving"], optional = true }
onchain-runtime-ledger-10 = { workspace = true, optional = true }
onchain-state-ledger-10 = { workspace = true, optional = true }
zswap-ledger-10 = { workspace = true, optional = true }
coin-structure-ledger-10 = { workspace = true, optional = true }
transient-crypto-ledger-10 = { workspace = true, optional = true }
ledger-storage-ledger-10 = { workspace = true, optional = true }


sp-runtime-interface.workspace = true
sp-runtime.workspace = true
sp-externalities.workspace = true
sp-tracing.workspace = true
parity-scale-codec = { workspace = true, features = ["derive", "max-encoded-len"] }
scale-info-derive.workspace = true
frame-support = { workspace = true, default-features = false }
midnight-primitives-ledger = { workspace = true, optional = true }
derive-where = { workspace = true, optional = true }

serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
log = { workspace = true, optional = true }
lazy_static = { workspace = true, optional = true }
moka = { version = "0.11.3", optional = true }
sha2 = { workspace = true, optional = true }
midnight-node-ledger-helpers = { workspace = true, optional = true }
scale-info.workspace = true

[dev-dependencies]
midnight-node-res = { workspace = true, features = ["test", "chain-spec"] }
midnight-ledger-unsafe-helpers = { workspace = true }

[features]
# Ledger 8 and 9 support. Cannot currently be enabled: their rc.5 crates and the ledger-10
# alpha's path-dep tree cannot coexist in one graph (see the workspace Cargo.toml). Kept as the
# cfg the gated code is written against, so re-enabling is a Cargo.toml change, not a rewrite.
legacy-ledgers = []
default = [
    "std",
    "test-utils"
]
std = [
    "sp-runtime-interface/std",
    "sp-runtime/std",
    "sp-externalities/std",
    "midnight-primitives-ledger/std",
    "parity-scale-codec/std",
    "scale-info/std",
    "frame-support/std",
    "serde/std",
    "serde_json",
    "hex",
    "log",
    "lazy_static",
    "moka",
    "base-crypto",
    "midnight-serialize",
    "midnight-storage-core",
    "parity-db",
    "transient-crypto",
    "mn-ledger-10",
    "onchain-runtime-ledger-10",
    "onchain-state-ledger-10",
    "zswap-ledger-10",
    "coin-structure-ledger-10",
    "transient-crypto-ledger-10",
    "ledger-storage-ledger-10",
    "sha2",
    "midnight-node-ledger-helpers",
    "derive-where"
]
runtime-benchmarks = []
test-utils = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(substrate_runtime)'] }
