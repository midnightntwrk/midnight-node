# Indexer 4.4 onwards. Alone in its file so that `indexer.graphql` still validates on 4.3.
# The latest block's post-block state, so the root is in the ledger's past-roots window.
# `ContractAction.zswapState` is taken mid-block, after the action's transaction.
query ContractZswapState($address: HexEncoded!) {
  block {
    contractZswapState(address: $address)
  }
}
