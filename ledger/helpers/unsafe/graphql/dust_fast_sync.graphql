# DUST fast-sync operations (`IndexerClient::dust_*`). Mostly `@beta`, so they live apart from
# `indexer.graphql`: indexers reject a whole document if any operation in it is invalid, and an
# indexer that changes or drops one of these must still accept the rest.

# The snapshot block a fast sync is pinned to.
query DustSnapshotBlock($height: Int!) {
  block(offset: { height: $height }) {
    hash
    dustCommitmentEndIndex
    dustGenerationEndIndex
    dustCommitmentMerkleTreeRoot
    dustGenerationMerkleTreeRoot
  }
}

# `endIndex` is inclusive.
query DustCommitmentCollapsedUpdate($startIndex: Int!, $endIndex: Int!) {
  dustCommitmentMerkleTreeUpdate(startIndex: $startIndex, endIndex: $endIndex) {
    update
  }
}

subscription DustNullifierTransactions(
  $prefixes: [HexEncoded!]!
  $fromBlock: Int!
  $toBlock: Int!
) {
  dustNullifierTransactions(
    nullifierLeBytesPrefixes: $prefixes
    fromBlock: $fromBlock
    toBlock: $toBlock
  ) {
    nullifierLeBytes
    transaction {
      __typename
      dustLedgerEvents {
        __typename
        raw
      }
    }
  }
}
