[package]
name = "midnight-ledger-unsafe-helpers"
description = "Utilities for toolkit and tests. Do not use in node, especially consensus."
version = "0.1.0"
edition = "2024"
license-file.workspace = true

[dependencies]
hex.workspace = true
sha2.workspace = true

midnight-node-ledger-helpers = { workspace = true }

base-crypto = { workspace = true }
midnight-serialize = { workspace = true }
transient-crypto = { workspace = true }

mn-ledger-8 = { workspace = true, features = ["proving"] }
ledger-storage-ledger-8 = { workspace = true }
# The toolkit's ledger arena (`arena_db`) can live in a ParityDB. Pulled in directly so the
# toolkit runs the storage layout and incremental GC the node runs (`layout-v2`, `gc-v1`)
# whether it is built alone or as part of the workspace.
midnight-storage-core = { workspace = true }
parity-db.workspace = true

mn-ledger-9 = { workspace = true, features = ["proving"] }
zkir-v3 = { workspace = true }
anyhow = { workspace = true }
ledger-storage-ledger-9 = { workspace = true }

# v8->v9 state translation table, used by the fork boundary (`fork::fork_8_to_9`).
v8-to-v9-state-translation = { workspace = true }

rand = { version = "0.8.4", features = ["small_rng", "getrandom"] }
rayon.workspace = true
log.workspace = true
lazy_static.workspace = true
itertools = { workspace = true, features = ["use_alloc"] }
thiserror.workspace = true
tokio.workspace = true
async-trait.workspace = true
futures.workspace = true
bip32.workspace = true
derive-where.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
bech32 = "0.11.0"

# Indexer GraphQL client: typed queries + WS subscriptions.
reqwest.workspace = true
graphql_client.workspace = true
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }

[features]
default = []
erase-proof = []
test-utils = []
fixed-point-custom-serde = ["mn-ledger-8/fixed-point-custom-serde", "mn-ledger-9/fixed-point-custom-serde"]

[dev-dependencies]
apollo-compiler.workspace = true

[package.metadata.cargo-shear]
# Not imported; depended on only to enable its `layout-v2` and `gc-v1` features.
ignored = ["midnight-storage-core"]
