[package]
name = "midnight-node-ledger-helpers"
version = "0.1.0"
edition = "2024"
license-file.workspace = true

# Resolves ledger dependency versions from Cargo.lock at build time (see build.rs).
# cargo_metadata 0.15.4 is already in the lock graph, so this adds no new packages.
[build-dependencies]
cargo_metadata = "0.15"

[dependencies]
hex.workspace = true

base-crypto = { workspace = true }
midnight-serialize = { workspace = true }
transient-crypto = { workspace = true }
anyhow = { workspace = true }
reqwest = { workspace = true }



mn-ledger-10 = { workspace = true, features = ["proving", "test-utilities"] }
onchain-runtime-ledger-10 = { workspace = true }
zswap-ledger-10 = { workspace = true }
coin-structure-ledger-10 = { workspace = true }
transient-crypto-ledger-10 = { workspace = true }
zkir-ledger-10 = { workspace = true }
ledger-storage-ledger-10 = { workspace = true }

rand = { version = "0.8.4", features = ["small_rng", "getrandom"] }
log.workspace = true
lazy_static.workspace = true
thiserror.workspace = true
derive-where.workspace = true
serde = { workspace = true, features = ["derive"] }
# Derive the u8 <-> variant and name <-> variant mappings from the enum declaration
# itself, so `LedgerVersion`'s wire discriminants can't drift from a hand-written table.
num_enum = "0.7"
strum.workspace = true
bip39 = "2.2.2"
subxt.workspace = true
subxt-signer.workspace = true
serde_bytes = "0.11"
zeroize = { workspace = true }

[dev-dependencies]
# Pins the cache wire format of `LedgerVersion` (see raw_block_data.rs tests).
postcard = { version = "1.1", features = ["alloc"] }
serde_json.workspace = true

[features]
# Ledger 8 and 9 support. Cannot currently be enabled: their rc.5 crates and the ledger-10
# alpha's path-dep tree cannot coexist in one graph (see the workspace Cargo.toml). Kept as the
# cfg the gated code is written against, so re-enabling is a Cargo.toml change, not a rewrite.
legacy-ledgers = []
default = []
fixed-point-custom-serde = ["mn-ledger-10/fixed-point-custom-serde"]
