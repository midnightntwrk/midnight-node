[package]
name = "midnight-node-ledger-helpers"
version = "0.1.0"
edition = "2024"
license-file.workspace = true

# Resolves ledger dependency versions from Cargo.lock at build time (see build.rs).
# cargo_metadata 0.15.4 is already in the lock graph, so this adds no new packages.
[build-dependencies]
cargo_metadata = "0.15"

[dependencies]
hex.workspace = true
sha2.workspace = true

mn-ledger = { workspace = true, features = ["proving"] }
base-crypto = { workspace = true }
coin-structure = { workspace = true }
onchain-runtime = { workspace = true }
midnight-serialize = { workspace = true }
ledger-storage = { workspace = true }
transient-crypto = { workspace = true }
zswap = { workspace = true }
zkir = { workspace = true }
# ZKIR-v3 (3.x proof system). Used directly by `versions/proving_provider/v2_or_v3.rs` to prove
# the ledger-9 Dust spend circuit, which `zkir` (midnight-zkir 2.2.0) can't even parse. The
# `binary` feature additionally unlocks the `zkir compile-many` CLI
# (`cargo build --bin zkir -p midnight-zkir-v3`) that scripts/seed-zk-keys.sh uses to
# regenerate the Dust and Zswap proving keys locally (see that script and
# Batch-Verification-Notes.md, "Proving keys: compile them, they aren't published").
zkir-v3 = { package = "midnight-zkir-v3", git = "https://github.com/midnightntwrk/midnight-ledger", rev = "31529634bc0c84f1cba4139125ddbbe5a8fc5407", features = ["binary"] }
anyhow = { workspace = true }
reqwest = { workspace = true }

mn-ledger-8 = { workspace = true, features = ["proving"] }
onchain-runtime-ledger-8 = { workspace = true }
onchain-state-ledger-8 = { workspace = true }
ledger-storage-ledger-8 = { workspace = true }
zswap-ledger-8 = { workspace = true }

mn-ledger-9 = { workspace = true, features = ["proving", "test-utilities"] }
onchain-runtime-ledger-9 = { workspace = true }
onchain-state-ledger-9 = { workspace = true }
zswap-ledger-9 = { workspace = true }
coin-structure-ledger-9 = { workspace = true }
transient-crypto-ledger-9 = { workspace = true }

rand = { version = "0.8.4", features = ["small_rng", "getrandom"] }
rayon.workspace = true
log.workspace = true
lazy_static.workspace = true
itertools = { workspace = true, features = ["use_alloc"] }
thiserror.workspace = true
tokio.workspace = true
async-trait.workspace = true
futures.workspace = true
bip32.workspace = true
derive-where.workspace = true
serde = { workspace = true, features = ["derive"] }
bech32 = "0.11.0"
bip39 = "2.2.2"
subxt.workspace = true
subxt-signer.workspace = true
serde_json.workspace = true
serde_bytes = "0.11"
zeroize = { workspace = true }

[features]
default = []
can-panic = []
erase-proof = []
test-utils = []
fixed-point-custom-serde = ["mn-ledger/fixed-point-custom-serde", "mn-ledger-8/fixed-point-custom-serde", "mn-ledger-9/fixed-point-custom-serde"]
