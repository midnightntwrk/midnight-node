[profile.ci.junit]  # this can be some other profile, too
path = "test-results-node.xml"

# Toolkit-js tests that invoke the JS CLI share a working directory where
# contract.config.ts is compiled to .js at runtime.  Running them in
# parallel causes a filesystem race on that generated file.
[test-groups.toolkit-js]
max-threads = 1

[[profile.ci.overrides]]
filter = "test(generate_intent)"
test-group = "toolkit-js"

# Each of these tests starts its own Postgres container. Run unthrottled next to
# the rest of the workspace, they starve each other and the containers hit
# testcontainers' 60s startup timeout. Applies to every profile.
[test-groups.postgres]
max-threads = 8

[[profile.default.overrides]]
filter = "package(partner-chains-db-sync-data-sources) | package(midnight-primitives-mainchain-follower)"
test-group = "postgres"
