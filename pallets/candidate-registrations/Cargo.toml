[package]
name = "pallet-candidate-registrations"
version = "0.1.0"
edition = "2024"
description = "Maintains the set of permissionless committee candidates registered by Cardano SPOs."
license-file.workspace = true

[dependencies]
frame-support.workspace = true
frame-system.workspace = true
midnight-primitives-candidate-registrations.workspace = true
sidechain-domain = { workspace = true, features = ["serde"] }
parity-scale-codec.workspace = true
scale-info.workspace = true
log.workspace = true
sp-core.workspace = true
sp-runtime.workspace = true
hex.workspace = true
serde = { workspace = true }
serde_valid = { workspace = true, optional = true }

[dev-dependencies]
sp-io.workspace = true

[features]
default = ["std"]
std = [
    "frame-support/std",
    "frame-system/std",
    "hex/std",
    "log/std",
    "midnight-primitives-candidate-registrations/std",
    "parity-scale-codec/std",
    "scale-info/std",
    "serde/std",
    "serde_valid",
    "sidechain-domain/std",
    "sp-core/std",
    "sp-io/std",
    "sp-runtime/std",
]
runtime-benchmarks = [
    "frame-support/runtime-benchmarks",
    "frame-system/runtime-benchmarks",
]
try-runtime = [
    "frame-support/try-runtime",
    "frame-system/try-runtime",
    "sp-runtime/try-runtime",
]

[package.metadata.cargo-shear]
ignored = ["parity-scale-codec"]