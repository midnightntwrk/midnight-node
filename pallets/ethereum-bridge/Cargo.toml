[package]
name = "pallet-ethereum-bridge"
version = "0.1.0"
edition = "2024"
license-file.workspace = true

[dependencies]
frame-support.workspace = true
frame-system.workspace = true
sp-core.workspace = true
sp-io.workspace = true
sp-runtime.workspace = true
parity-scale-codec = { workspace = true, features = ["derive", "max-encoded-len"] }
scale-info = { workspace = true, features = ["derive"] }
midnight-node-ledger.workspace = true
midnight-primitives.workspace = true
snowbridge-inbound-queue-primitives.workspace = true
snowbridge-outbound-queue-primitives.workspace = true

[dev-dependencies]
snowbridge-pallet-ethereum-client = { workspace = true, features = ["std"] }
snowbridge-pallet-ethereum-client-fixtures = { workspace = true, features = ["std"] }
snowbridge-beacon-primitives = { workspace = true, features = ["std"] }
serde_json.workspace = true
hex.workspace = true

[features]
default = ["std"]
std = ["frame-support/std", "frame-system/std", "sp-core/std", "sp-io/std", "sp-runtime/std", "parity-scale-codec/std", "scale-info/std", "midnight-node-ledger/std", "midnight-primitives/std", "snowbridge-inbound-queue-primitives/std", "snowbridge-outbound-queue-primitives/std"]
