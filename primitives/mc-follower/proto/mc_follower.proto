//
// mc-follower gRPC contract.
//
// The canonical copy of this file lives in the mc-follower repository
// (https://github.com/SeungheonOh/mc-follower). Companion documents there:
// docs/CONTRACT.md (trait mapping, data-model semantics) and docs/SPEC.md
// (design decisions).
//
// Source references below are to midnight-node at tag node-2.1.101; line
// numbers may have moved since.
//
// Every RPC except GetStatus replaces exactly one SQL query that a running
// Midnight node executes against cardano-db-sync (GetBlockByHash replaces two
// queries that differ only in one selected column). "Replaces" means: same
// filters, same total ordering, same limit/offset semantics, same columns,
// evaluated against the indexer's current chain (volatile blocks included),
// exactly as db-sync answers against its current database.
//
// Source references are `path:line` in the midnight-node repository.
// Abbreviations used in comments:
//   PC   = partner-chains/toolkit/data-sources/db-sync/src
//   MF   = primitives/mainchain-follower/src
//
// Fidelity rules referenced as "SPEC 4.x" (docs/SPEC.md section 4):
//   4.addr      address rendering (db-sync renderAddress: bech32 / base58)
//   4.time      block time = slot start time, whole seconds UTC
//   4.txidx     tx_count and tx index include phase-2-invalid transactions
//   4.invalid   phase-2-invalid txs: only collateral-return output at index
//               len(regular outputs); inputs are the collateral inputs; no
//               metadata, no witness datums
//   4.datum     datum resolvable if inline, or its hash appeared in the witness
//               set of a valid transaction; original bytes served
//   4.meta      metadata only for valid transactions
//   4.ebb       EBBs have no block number; excluded from block-number queries
//
// Conventions:
//   * Hashes, policy ids, asset names, pool hashes and nonces are raw bytes
//     (32 / 28 / 0..32 / 28 / 32 bytes respectively).
//   * Addresses are the exact text db-sync stores in `tx_out.address`
//     (SPEC 4.addr). Address filters are TEXT EQUALITY on that rendering,
//     never on decoded address bytes (see CONTRACT.md section 3).
//   * Block numbers are uint32 (Rust BlockNumber(u32), decoded from INT4).
//     Epoch numbers are uint32 (Rust EpochNumber(u32), INT4). Slots are
//     uint64 (Rust SlotNumber(u64), INT8). Transaction index within block is
//     uint32 (Rust TxIndexInBlock(u32), INT4). Output index is uint32 on the
//     wire but always < 2^15 (Rust TxIndex(u16), db-sync `txindex` smallint).
//   * A "position" is (block_no, tx_index); positions are totally ordered
//     lexicographically, matching both SQL row comparisons and the Rust
//     CardanoPosition / TxOrderingKey orderings.
//   * Absence of a row is encoded in the response (`optional` fields or an
//     empty stream), never as a gRPC error, because the SQL returns zero rows
//     and the Rust code decides what absence means.
//
// Error model (all RPCs):
//   * OK with an absent/empty result: the query legitimately has no rows.
//   * UNAVAILABLE: the store is not open, or the indexer has not yet reached
//     its configured start point, or a backfill for an address/policy named in
//     the request is in progress. The node treats this like a failed Postgres
//     connection (an error from the data source).
//   * FAILED_PRECONDITION: the request names an address or policy the
//     indexer is not configured to index. Must never be answered with an empty
//     result, because db-sync would have returned rows.
//   * OUT_OF_RANGE: a value the SQL path would fail to decode in Rust (noted
//     per RPC) appears in a returned row. Prefer returning the raw value and
//     letting Rust fail; OUT_OF_RANGE is only used where the wire type cannot
//     carry the value.
//   * INVALID_ARGUMENT: malformed request (wrong hash length, etc.).
//   * Each RPC is answered from one read snapshot of the store (one SQLite
//     read transaction for the whole stream).

syntax = "proto3";

package mcfollower.v1;

service McFollower {
  // ---------------------------------------------------------------------
  // Indexer status (no SQL equivalent).
  // ---------------------------------------------------------------------

  // Tip, immutable extent and sync state of the indexer. Not used by the
  // existing data-source logic (which derives freshness from GetLatestBlock);
  // intended for health checks, operator tooling and startup probes.
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);

  // ---------------------------------------------------------------------
  // Block data source (PC/block, used by mc_hash, sidechain_rpc, bridge).
  // ---------------------------------------------------------------------

  // Replaces: get_latest_block_info, PC/db_model.rs:217.
  //   SELECT block_no, hash, epoch_no, slot_no, time FROM block
  //   WHERE block_no IS NOT NULL ORDER BY block_no DESC LIMIT 1
  // Ordering: block_no DESC. Limit: 1. Bounds: none.
  // Returns the highest-numbered block of the indexer's current chain
  // (volatile part included), or nothing if no block is indexed.
  // Fidelity: SPEC 4.time, 4.ebb.
  // Callers: BlockDataSourceImpl::get_latest_block_info (PC/block/mod.rs:107),
  //   is_cardano_ok (PC/block/mod.rs:179), get_stable_block_by_hash_from_db
  //   (PC/block/mod.rs:403), fill_cache (PC/block/mod.rs:457).
  rpc GetLatestBlock(GetLatestBlockRequest) returns (OptionalBlock);

  // Replaces: get_blocks_by_numbers, PC/db_model.rs:244.
  //   SELECT block_no, hash, epoch_no, slot_no, time FROM block
  //   WHERE block_no >= $from AND block_no <= $to ORDER BY block_no ASC
  // Ordering: block_no ASC (total: block_no is unique on one chain).
  // Bounds: from_block_no inclusive, to_block_no inclusive. Limit: none.
  // Empty stream if from > to. Fidelity: SPEC 4.time, 4.ebb.
  // Caller: BlockDataSourceImpl::fill_cache (PC/block/mod.rs:466); the range
  // is at most cache_size (100) + 1 blocks.
  rpc GetBlocksByNumberRange(GetBlocksByNumberRangeRequest) returns (stream Block);

  // Replaces: get_highest_block, PC/db_model.rs:270.
  //   SELECT block_no, hash, epoch_no, slot_no, time FROM block
  //   WHERE block_no <= $max_block AND $min_slot <= slot_no AND slot_no <= $max_slot
  //     AND $min_time <= time AND time <= $max_time
  //   ORDER BY block_no DESC LIMIT 1
  // Ordering: block_no DESC. Limit: 1.
  // Bounds: block_no <= max_block_no (inclusive); slot in
  //   [min_slot, max_slot] (both inclusive); time in [min_time, max_time]
  //   (both inclusive). Times are compared at millisecond precision: the
  //   Rust bounds are NaiveDateTime values with millisecond resolution
  //   (reference timestamp minus a TimeDelta in ms), while block time is
  //   whole seconds, so the server compares block.time_unix_seconds * 1000
  //   against the *_unix_millis bounds.
  // Fidelity: SPEC 4.time, 4.ebb (EBBs never match: no block_no).
  // Caller: BlockDataSourceImpl::get_latest_block (PC/block/mod.rs:306);
  //   all bound values are computed in Rust from node config and the
  //   reference timestamp (CONTRACT.md section 4).
  rpc GetHighestBlockInWindow(GetHighestBlockInWindowRequest) returns (OptionalBlock);

  // Replaces two queries that differ only in the `tx_count` column:
  //   * get_block_by_hash, PC/db_model.rs:297
  //       SELECT block_no, hash, epoch_no, slot_no, time FROM block WHERE hash = $1
  //   * get_block_by_hash, MF/db/queries/cnight_observation.rs:369
  //       SELECT block_no, hash, epoch_no, slot_no, time, tx_count FROM block WHERE hash = $1
  // Ordering: n/a (hash is unique). Limit: at most one row.
  // Returns the block if it is on the indexer's current chain.
  // EBB (no block number): returned as absent. db-sync would return a row
  // with NULL block_no that fails to decode in Rust (an error); see
  // CONTRACT.md section 5, item R9.
  // Fidelity: SPEC 4.time, 4.txidx (tx_count counts phase-2-invalid txs), 4.ebb.
  // Callers: BlockDataSourceImpl::get_block_by_hash (PC/block/mod.rs:151),
  //   get_stable_block_by_hash_from_db (PC/block/mod.rs:411),
  //   TokenBridgeDataSourceImpl::get_transfers (PC/bridge/mod.rs:97),
  //   MidnightCNightObservationDataSourceImpl::get_utxos_up_to_capacity
  //   (MF/data_source/cnight_observation.rs:147),
  //   FederatedAuthorityObservationDataSourceImpl::get_federated_authority_data
  //   (MF/data_source/federated_authority_observation.rs:96).
  rpc GetBlockByHash(GetBlockByHashRequest) returns (OptionalBlock);

  // ---------------------------------------------------------------------
  // Token bridge (PC/bridge).
  // ---------------------------------------------------------------------

  // Replaces: get_block_info_for_tx_hash, PC/db_model.rs:710.
  //   SELECT block.block_no, tx.block_index FROM tx JOIN block ON block.id = tx.block_id
  //   WHERE tx.hash = $1
  // Ordering: n/a. Limit: at most one row (tx hash unique on one chain).
  // Any transaction of the current chain, valid or phase-2-invalid.
  // Fidelity: SPEC 4.txidx.
  // Callers: TokenBridgeDataSourceImpl::resolve_tx_position
  //   (PC/bridge/mod.rs:140), CachedTokenBridgeDataSourceImpl::resolve_tx_position
  //   (PC/bridge/cache.rs:257, only on a miss in the in-memory tx cache).
  rpc GetTxPosition(GetTxPositionRequest) returns (GetTxPositionResponse);

  // Replaces: get_bridge_txs, PC/db_model.rs:732 (both tx_in variants,
  // PC/db_model.rs:764-824; the gRPC semantics equal the `tx_in` table
  // variant, see CONTRACT.md section 3, item S10).
  // Row definition, for each transaction T of the current chain such that:
  //   (a) T produced at least one output at ics_address carrying
  //       (policy_id, asset_name)  [relevant_txs, PC/db_model.rs:860],
  //   (b) block_no(T) <= to_block_no (inclusive),
  //   (c) T is strictly after / at-or-after the lower bound (see `lower`),
  //   (d) bridge_out > bridge_in OR reserve_in > reserve_out
  //       (PC/db_model.rs:877), compared as exact integers,
  // return one row with:
  //   bridge_in   = sum of the asset quantity over outputs at ics_address
  //                 consumed by T (inputs of T; collateral inputs if T is
  //                 phase-2-invalid; reference inputs never count),
  //   bridge_out  = sum over outputs of T at ics_address,
  //   reserve_in  = sum over outputs at reserve_address consumed by T,
  //   reserve_out = sum over outputs of T at reserve_address,
  //   c2m_metadatum_cbor = metadatum of T under label 6500973
  //                 (TOKEN_TRANSFER_METADATUM_KEY) if T is valid and has it.
  // Each sum is over one row per (output, asset); an output carries at most
  // one quantity of a given (policy, name), so no join multiplication.
  // Missing sums are 0 (COALESCE). Spends are counted regardless of whether
  // the spent output was created before or after the lower bound.
  // Ordering: (block_no ASC, tx_index ASC) - total.
  // Limit: max_txs if set; unlimited if unset (SQL `LIMIT null`).
  // Callers: TokenBridgeDataSourceImpl::get_transfers (PC/bridge/mod.rs:118,
  //   limit max_transfers+1), CachedTokenBridgeDataSourceImpl::fill_cache
  //   (PC/bridge/cache.rs:210, no limit, lower bound Block(from-1), upper
  //   bound min(to + lookahead, latest stable)).
  // Fidelity: SPEC 4.addr (text equality on both addresses), 4.txidx,
  //   4.invalid (collateral return output counts as an output, collateral
  //   inputs count as inputs), 4.meta.
  // Rust decodes each sum with BigDecimal::to_u64 (NativeTokenAmount,
  // PC/db_model.rs:208-214): a returned row with a sum > u64::MAX makes the
  // whole query fail. The server returns exact 128-bit sums; the Rust client
  // reproduces the failure.
  rpc GetBridgeTxs(GetBridgeTxsRequest) returns (stream BridgeTxRow);

  // ---------------------------------------------------------------------
  // Authority selection (Midnight's own,
  // MF/data_source/candidates_data_source).
  // ---------------------------------------------------------------------

  // Replaces: get_latest_block_for_epoch,
  // MF/data_source/candidates_data_source/db_model.rs:210.
  //   SELECT block_no, hash, epoch_no, slot_no FROM block
  //   WHERE epoch_no <= $1 AND slot_no IS NOT NULL AND block_no IS NOT NULL
  //   ORDER BY slot_no DESC LIMIT 1
  // Ordering: slot_no DESC (total among non-EBB blocks: one block per slot).
  // Limit: 1. Bounds: epoch_no <= epoch (inclusive). The block's epoch is the
  // epoch of its slot (CONTRACT.md section 3, item S8).
  // Fidelity: SPEC 4.ebb. Rust reads only block_no
  // (candidates_data_source/mod.rs:173); the full Block is returned.
  // Caller: CandidatesDataSourceImpl::get_last_block_for_epoch
  //   (candidates_data_source/mod.rs:171). Reached only via get_candidates
  //   (RPC only in node-2.1.101).
  rpc GetLatestBlockForEpoch(GetLatestBlockForEpochRequest) returns (OptionalBlock);

  // Replaces: get_latest_stable_epoch,
  // MF/data_source/candidates_data_source/db_model.rs:228.
  //   SELECT stable_block.epoch_no - 1 AS epoch_no
  //   FROM block INNER JOIN block AS stable_block
  //     ON block.block_no - $k = stable_block.block_no
  //   WHERE block.block_no IS NOT NULL ORDER BY block.block_no DESC LIMIT 1
  // Semantics: let tip = highest block_no; if tip >= k, return
  //   epoch_no(block number tip - k) - 1; otherwise absent.
  // Ordering: block_no DESC. Limit: 1.
  // The value can be -1 (stable block in epoch 0); Rust decodes the column
  // into EpochNumber(u32) via i32 -> u32 try_into, which fails on -1. The
  // server returns the signed value; the Rust client reproduces the failure.
  // Caller: CandidateDataSourceCached::can_use_caching_for_request
  //   (candidates_data_source/cached.rs:219). security_parameter is node
  //   config (CARDANO_SECURITY_PARAMETER), passed through.
  rpc GetLatestStableEpoch(GetLatestStableEpochRequest) returns (GetLatestStableEpochResponse);

  // Replaces: get_stake_distribution,
  // MF/data_source/candidates_data_source/db_model.rs:245.
  //   SELECT ph.hash_raw AS pool_hash, SUM(es.amount) AS stake
  //   FROM epoch_stake es INNER JOIN pool_hash ph ON es.pool_id = ph.id
  //   WHERE es.epoch_no = $1 GROUP BY ph.hash_raw
  // One row per pool with stake in db-sync `epoch_stake` for `epoch`,
  // stake = sum over that pool's delegations (SPEC section 3 "Pool stake").
  // Ordering: the SQL has none; the server streams by pool_hash ASC. Rust
  // folds into a HashMap (candidates_data_source/mod.rs:222), so order is
  // not observable.
  // Empty stream when the distribution for that epoch is not (completely)
  // available; Rust maps an empty map to `stake_delegation: None` for every
  // candidate (candidates_data_source/mod.rs:235), so partial data must never
  // be served (CONTRACT.md section 5, item R7).
  // Rust decodes stake with BigDecimal::to_u64 (StakeDelegation,
  // PC/../utils/db-sync-sqlx/src/lib.rs:206); a per-pool sum cannot exceed
  // the lovelace supply, so uint64 is sufficient.
  // Caller: CandidatesDataSourceImpl::get_candidates
  //   (candidates_data_source/mod.rs:113). RPC only in node-2.1.101.
  rpc GetStakeDistribution(GetStakeDistributionRequest) returns (stream StakePoolEntry);

  // Replaces: get_token_utxo_for_epoch,
  // MF/data_source/candidates_data_source/db_model.rs:260, together with the
  // multi_asset id resolution it depends on (MF/db/multi_asset_cache.rs:50).
  //   SELECT origin_tx.hash, tx_out.index, origin_block.epoch_no,
  //          origin_block.block_no, origin_block.slot_no, origin_tx.block_index,
  //          datum.value
  //   FROM ma_tx_out JOIN tx_out JOIN tx origin_tx JOIN block origin_block
  //   LEFT JOIN datum ON tx_out.data_hash = datum.hash
  //   WHERE ma_tx_out.ident = ident(policy, name) AND origin_block.epoch_no <= $epoch
  //   ORDER BY tx_block_no DESC, origin_tx.block_index DESC LIMIT 1
  // Semantics: the most recently created output (any address, spent or
  // unspent - NO spent-ness check) carrying any positive quantity of the
  // exact asset (policy_id, asset_name), created in a block whose epoch is
  // <= epoch. If the (policy, name) pair never appeared on chain the result
  // is absent (multi_asset_cache returns None -> no query,
  // candidates_data_source/mod.rs:82-85).
  // Ordering: (block_no DESC, tx_index DESC). NOT total: two outputs of the
  // same transaction both carrying the asset tie. The server breaks the tie
  // by output index DESC (recommendation, CONTRACT.md section 5, item R1).
  // Limit: 1.
  // Datum: LEFT JOIN, then decoded with the strict DbDatum decoder
  // (TokenTxOutput.datum: Option<DbDatum>): absent -> None (Rust then returns
  // ExpectedDataNotFound, candidates_data_source/mod.rs:95); present but not
  // decodable -> the whole query fails. `datum` is set iff SPEC 4.datum
  // resolves the output's datum.
  // Fidelity: SPEC 4.datum, 4.invalid, 4.txidx.
  // Caller: CandidatesDataSourceImpl::get_ariadne_parameters
  //   (candidates_data_source/mod.rs:83); asset_name is empty in practice.
  rpc GetLatestTokenOutputForEpoch(GetLatestTokenOutputForEpochRequest) returns (GetLatestTokenOutputForEpochResponse);

  // Replaces: get_epoch_nonce,
  // MF/data_source/candidates_data_source/db_model.rs:289.
  //   SELECT nonce FROM epoch_param WHERE epoch_no = $1
  // Returns the epoch nonce in force during `epoch` (db-sync epoch_param
  // row for that epoch). Absent when the indexer has not yet produced it
  // (db-sync: row not inserted yet). Rust caches only present values
  // (candidates_data_source/cached.rs:97). Limit: at most one row.
  // Caller: CandidatesDataSourceImpl::get_epoch_nonce
  //   (candidates_data_source/mod.rs:128).
  rpc GetEpochNonce(GetEpochNonceRequest) returns (GetEpochNonceResponse);

  // Replaces: get_utxos_for_address,
  // MF/data_source/candidates_data_source/db_model.rs:314, both variants
  // (tx_in table :330, consumed_by_tx_id :378). gRPC semantics equal the
  // `tx_in` table variant (CONTRACT.md section 3, item S10).
  // Semantics: every output whose address text equals `address`, created in
  // a block with block_no <= block_no, and not consumed by any transaction
  // in a block with block_no <= block_no (i.e. unspent as of the END of
  // block `block_no`; a spend inside block `block_no` hides the output).
  // Spends include collateral inputs of phase-2-invalid txs; reference inputs
  // are not spends.
  // tx_inputs: all inputs of the creating transaction (collateral inputs if
  // it is phase-2-invalid), ordered by (tx_hash bytes ASC, index ASC)
  // (array_agg ... ORDER BY consumes_tx.hash, index). The SQL renders them as
  // "hex#index" strings; Rust parses them back into UtxoId, so the wire
  // carries them structured.
  // datum: LEFT JOIN, decoded with DbDatumIfValid (NULL or undecodable ->
  // None, row kept). `datum` is set iff SPEC 4.datum resolves the datum.
  // Ordering: the SQL has NO ORDER BY (row order unspecified); the server
  // streams in (block_no ASC, tx_index ASC, output_index ASC). See
  // CONTRACT.md section 5, item R2.
  // Limit: none.
  // Fidelity: SPEC 4.addr, 4.datum, 4.invalid, 4.txidx.
  // Caller: CandidatesDataSourceImpl::get_registered_candidates
  //   (candidates_data_source/mod.rs:187). RPC only in node-2.1.101.
  rpc GetUnspentOutputsAtAddress(GetUnspentOutputsAtAddressRequest) returns (stream AddressOutputRow);

  // ---------------------------------------------------------------------
  // cNIGHT observation (MF/data_source/cnight_observation.rs).
  //
  // Common window semantics for the four range RPCs below (PagedQuery,
  // MF/db/types.rs:197): a row's position P is the position of the
  // transaction named per RPC (creating tx or spending tx). A row is in the
  // window iff from_inclusive <= P < to_exclusive, i.e.
  //   (block_no > from.block_no OR (block_no = from.block_no AND tx_index >= from.tx_index))
  //   AND (block_no < to.block_no OR (block_no = to.block_no AND tx_index < to.tx_index)).
  // In practice `to_exclusive` is (tip.block_no, tip.tx_count + 1)
  // (cnight_observation.rs:147-179, types.rs:100-108).
  // Limit/offset: ORDER BY <key> LIMIT limit OFFSET offset, applied after
  // filtering; limit and offset are each < 2^31 (asserted in Rust). The node
  // currently always sends offset 0 (cnight_observation.rs:190).
  // The db-sync id-range pre-filters (get_low_bounds / get_high_bounds,
  // queries/cnight_observation.rs:396,426) are supersets of the window and
  // are not part of this contract.
  // Rows that Rust later drops (undecodable datum, non-base address) are
  // still returned: they count toward the limit and toward the
  // "page filled its cap" frontier (cnight_observation.rs:495-514).
  // ---------------------------------------------------------------------

  // Replaces: get_registrations, MF/db/queries/cnight_observation.rs:27.
  // Rows: every output O such that
  //   O.address text = mapping_validator_address,
  //   O carries exactly quantity 1 of auth_token (policy, name)
  //     (ma_tx_out.quantity = 1; other assets on O are irrelevant),
  //   O's datum is resolvable (INNER JOIN datum, SPEC 4.datum),
  //   creating tx position in the window.
  // No spent-ness check.
  // Ordering: (block_no ASC, tx_index ASC, output_index ASC) - total.
  // Datum decoding in Rust: DbDatumIfValid (undecodable -> None -> row
  // dropped after counting).
  // Fidelity: SPEC 4.addr, 4.datum, 4.invalid, 4.txidx, 4.time.
  // Caller: get_registration_utxos (cnight_observation.rs:492).
  rpc GetMappingRegistrations(GetMappingRegistrationsRequest) returns (stream RegistrationRow);

  // Replaces: get_deregistrations, MF/db/queries/cnight_observation.rs:84.
  // Rows: one per (spending transaction T, spent output O) such that
  //   O.address text = mapping_validator_address,
  //   O's datum is resolvable (INNER JOIN datum, SPEC 4.datum),
  //   T's position in the window,
  //   T consumes O (inputs of T; collateral inputs if T is phase-2-invalid;
  //   reference inputs never).
  // NO auth-token or asset filter: any output at the address counts.
  // Ordering: (block_no ASC, tx_index ASC, utxo_tx_hash ASC (bytes),
  //   utxo_index ASC) - total.
  // Datum decoding in Rust: DbDatumIfValid.
  // Fidelity: SPEC 4.addr, 4.datum, 4.invalid, 4.txidx, 4.time.
  // Caller: get_deregistration_utxos (cnight_observation.rs:552).
  rpc GetMappingDeregistrations(GetMappingDeregistrationsRequest) returns (stream DeregistrationRow);

  // Replaces: get_asset_creates, MF/db/queries/cnight_observation.rs:137.
  // Rows: every output O carrying asset (policy, name) at ANY address,
  // creating tx position in the window. quantity = O's quantity of that
  // asset. holder_address = O.address text.
  // Ordering: (block_no ASC, tx_index ASC, output_index ASC) - total.
  // The SQL casts quantity to BIGINT; Postgres fails the query if it exceeds
  // i64::MAX. The server returns the raw uint64; the Rust client must fail
  // when quantity > i64::MAX.
  // Fidelity: SPEC 4.addr (Rust parses holder_address as bech32 and skips
  //   non-base / base58 addresses), 4.invalid, 4.txidx, 4.time.
  // Caller: get_asset_create_utxos (cnight_observation.rs:612).
  rpc GetAssetCreates(GetAssetCreatesRequest) returns (stream AssetCreateRow);

  // Replaces: get_asset_spends, MF/db/queries/cnight_observation.rs:188.
  // Rows: one per (spending transaction T, spent output O) where O carries
  // asset (policy, name) at any address and T's position is in the window
  // (inputs of T; collateral inputs if T is phase-2-invalid; reference
  // inputs never). block_* / tx_index are T's; quantity / holder_address /
  // utxo_* are O's.
  // Ordering: (block_no ASC, tx_index ASC, utxo_tx_hash ASC (bytes),
  //   utxo_index ASC) - total.
  // Same BIGINT note as GetAssetCreates.
  // Fidelity: SPEC 4.addr, 4.invalid, 4.txidx, 4.time.
  // Caller: get_asset_spend_utxos (cnight_observation.rs:676).
  rpc GetAssetSpends(GetAssetSpendsRequest) returns (stream AssetSpendRow);

  // Replaces: get_max_tx_size, MF/db/queries/cnight_observation.rs:453.
  //   SELECT MAX(epoch_param.max_tx_size)::BIGINT FROM block
  //   JOIN epoch_param ON epoch_param.epoch_no = block.epoch_no
  //   WHERE block.block_no = $1
  // Returns the protocol parameter maxTxSize in force in the epoch of block
  // `block_no`. Absent if the block is unknown or the epoch's parameters are
  // not yet available (Rust then fails with MissingEpochParams,
  // cnight_observation.rs:172).
  // Caller: get_utxos_up_to_capacity (cnight_observation.rs:170), only for
  //   ObservationBound::Cost, with block_no = start position block.
  rpc GetMaxTxSize(GetMaxTxSizeRequest) returns (GetMaxTxSizeResponse);

  // ---------------------------------------------------------------------
  // Federated authority observation
  // (MF/data_source/federated_authority_observation.rs).
  // ---------------------------------------------------------------------

  // Replaces: get_governance_body_utxo,
  // MF/db/queries/federated_authority_observation.rs:29.
  //   SELECT datum.value, block.block_no, block.hash, tx.block_index, tx.hash, tx_out.index
  //   FROM tx_out JOIN datum ON tx_out.data_hash = datum.hash JOIN tx JOIN block
  //   JOIN ma_tx_out JOIN multi_asset ma ON ma.id = ma_tx_out.ident
  //   WHERE tx_out.address = $1 AND ma.policy = $2 AND block.block_no <= $3
  //   ORDER BY block.block_no DESC, tx.block_index DESC LIMIT 1
  // Semantics: the most recently created output (NO spent-ness check) at
  // `address` (text equality) carrying any asset of `policy_id` (any asset
  // name), with a resolvable datum (INNER JOIN, SPEC 4.datum), created in a
  // block with block_no <= block_no (inclusive).
  // An output carrying several asset names of the policy yields several
  // identical rows in SQL; irrelevant under LIMIT 1.
  // Ordering: (block_no DESC, tx_index DESC). NOT total across two outputs
  // of the same transaction; the server breaks the tie by output index DESC
  // (recommendation, CONTRACT.md section 5, item R1). Limit: 1.
  // Datum decoding in Rust: strict DbDatum (GovernanceBodyUtxoRow.full_datum,
  //   MF/db/types.rs:174): undecodable -> the whole query fails.
  // Fidelity: SPEC 4.addr, 4.datum, 4.invalid, 4.txidx.
  // Callers: get_federated_authority_data
  //   (federated_authority_observation.rs:107 council, :141 technical committee).
  rpc GetLatestGovernanceOutput(GetLatestGovernanceOutputRequest) returns (GetLatestGovernanceOutputResponse);
}

// =========================================================================
// Shared types
// =========================================================================

// A block of the indexer's current chain. Mirrors PC/db_model.rs:85 (Block),
// MF/db/types.rs:91 (Block, with tx_count) and
// MF/data_source/candidates_data_source/db_model.rs:134 (Block, no time).
// EBBs are never returned (SPEC 4.ebb).
message Block {
  uint32 block_no = 1;            // BlockNumber(u32)
  bytes hash = 2;                 // 32 bytes
  uint32 epoch_no = 3;            // EpochNumber(u32); epoch of the block's slot
  uint64 slot_no = 4;             // SlotNumber(u64)
  // Slot start time, whole seconds since the Unix epoch, UTC (SPEC 4.time).
  // Rust ends with: MainchainBlock.timestamp = seconds (u64,
  // PC/db_model.rs:101); NaiveDateTime for window checks (PC/block/mod.rs);
  // CardanoPosition.block_timestamp = seconds * 1000 (MF/db/types.rs:105).
  int64 time_unix_seconds = 5;
  // Number of transactions in the block, phase-2-invalid included
  // (SPEC 4.txidx). Rust: i64 (MF/db/types.rs:97), used as the tip's
  // CardanoPosition.tx_index_in_block via `as u32`.
  uint64 tx_count = 6;
}

message OptionalBlock {
  optional Block block = 1;
}

// (block_no, tx_index). Lexicographic order.
message Position {
  uint32 block_no = 1;
  uint32 tx_index = 2;   // index of the transaction in its block (SPEC 4.txidx)
}

// Half-open position window [from_inclusive, to_exclusive).
message PositionWindow {
  Position from_inclusive = 1;
  Position to_exclusive = 2;
}

// Native asset identifier (multi_asset.policy, multi_asset.name).
message AssetId {
  bytes policy_id = 1;    // 28 bytes
  bytes asset_name = 2;   // 0..32 bytes; empty name is the empty byte string
}

// Transaction output reference (UtxoId).
message OutputRef {
  bytes tx_hash = 1;      // 32 bytes
  uint32 index = 2;       // < 2^15
}

// A resolved datum (SPEC 4.datum). `cbor` is the original on-chain bytes of
// the Plutus data whose blake2b-256 hash equals the output's datum hash
// (inline datum bytes, or the witness-set datum bytes).
//
// Presence rules, preserving the SQL join semantics:
//   * INNER JOIN queries (registrations, deregistrations, governance): a row
//     exists only if the datum is resolvable, so the field is always set.
//   * LEFT JOIN queries (token output, address outputs): unset iff the
//     output has no datum hash or the hash is not resolvable (SQL NULL).
//
// The Rust client must turn `cbor` into the same PlutusData (or the same
// "absent"/error outcome) that db-sync's JSON + encode_json_value_to_plutus_datum
// path produces; see CONTRACT.md section 3, item S5. The server never decodes
// or re-encodes datums.
message Datum {
  bytes cbor = 1;
}

// Unsigned integer up to 2^128-1, for sums that the SQL computes as
// unbounded NUMERIC. value = hi * 2^64 + lo.
message Uint128 {
  fixed64 hi = 1;
  fixed64 lo = 2;
}

// =========================================================================
// Status
// =========================================================================

message GetStatusRequest {}

message GetStatusResponse {
  // Highest block of the current chain (same row GetLatestBlock returns).
  optional Block tip = 1;
  // Highest block that can no longer be rolled back by the upstream
  // (tip.block_no - k, k = the indexer's configured security parameter).
  // Absent while fewer than k blocks are indexed.
  optional Block immutable_tip = 2;
  // Security parameter k the indexer uses for its own rollback window.
  uint32 security_parameter = 3;
  // True while the indexer is behind its upstream (initial sync, catch-up
  // after reconnect, or any backfill in progress).
  bool syncing = 4;
  // Upstream tip as last reported by chain-sync (slot and block number), for
  // lag reporting. Absent before the first chain-sync exchange.
  optional uint64 upstream_tip_slot = 5;
  optional uint32 upstream_tip_block_no = 6;
  // First block the index covers (configured per-network start point).
  optional Block start_block = 7;
  // Backfills in progress, as human-readable identifiers (address text or
  // hex policy id). Requests naming one of these get UNAVAILABLE.
  repeated string backfilling = 8;
  // Cardano network magic the indexer follows.
  uint32 network_magic = 9;
}

// =========================================================================
// Block data source
// =========================================================================

message GetLatestBlockRequest {}

message GetBlocksByNumberRangeRequest {
  uint32 from_block_no = 1;   // inclusive
  uint32 to_block_no = 2;     // inclusive
}

message GetHighestBlockInWindowRequest {
  uint32 max_block_no = 1;            // block_no <= max_block_no
  uint64 min_slot = 2;                // min_slot <= slot_no
  uint64 max_slot = 3;                // slot_no <= max_slot
  int64 min_time_unix_millis = 4;     // min_time <= time (ms precision)
  int64 max_time_unix_millis = 5;     // time <= max_time (ms precision)
}

message GetBlockByHashRequest {
  bytes hash = 1;   // 32 bytes
}

// =========================================================================
// Token bridge
// =========================================================================

message GetTxPositionRequest {
  bytes tx_hash = 1;   // 32 bytes
}

// Mirrors TxBlockInfo (PC/db_model.rs:704).
message GetTxPositionResponse {
  optional Position position = 1;
}

message GetBridgeTxsRequest {
  string ics_address = 1;       // illiquid circulation supply validator address
  string reserve_address = 2;   // reserve validator address
  AssetId token = 3;            // bridge token (policy, name)
  // Lower bound, mirroring ResolvedBridgeDataCheckpoint
  // (PC/db_model.rs:675, :747-759).
  oneof lower {
    // Block{number}: block_no > after_block_no.
    uint32 after_block_no = 4;
    // Tx{block_number, tx_ix}: (block_no, tx_index) > after_position.
    Position after_position = 5;
    // TxReserveTransfer{block_number, tx_ix}: (block_no, tx_index) >= from_position.
    Position from_position = 6;
  }
  uint32 to_block_no = 7;       // block_no <= to_block_no (inclusive)
  optional uint32 max_txs = 8;  // LIMIT; unset = no limit
}

// Mirrors BridgeTx (PC/db_model.rs:639).
message BridgeTxRow {
  uint32 block_no = 1;     // block_number: BlockNumber
  uint32 tx_index = 2;     // tx_ix: TxIndexInBlock
  bytes tx_hash = 3;       // tx_hash: TxHash
  // c2m_metadata: CBOR of the metadatum under label 6500973 in T's
  // auxiliary data (the value only, not the label map). Unset when T has no
  // such label (or T is phase-2-invalid, SPEC 4.meta). The Rust client maps
  // it to the Option<JsonValue> that metadata_to_recipient consumes; see
  // CONTRACT.md section 3, item S6.
  optional bytes c2m_metadatum_cbor = 4;
  Uint128 bridge_in = 5;
  Uint128 bridge_out = 6;
  Uint128 reserve_in = 7;
  Uint128 reserve_out = 8;
}

// =========================================================================
// Authority selection
// =========================================================================

message GetLatestBlockForEpochRequest {
  uint32 epoch_no = 1;   // epoch_no <= this (inclusive)
}

message GetLatestStableEpochRequest {
  uint32 security_parameter = 1;   // k, node config
}

message GetLatestStableEpochResponse {
  // stable_block.epoch_no - 1; may be -1. Absent when tip < k or no blocks.
  optional int64 epoch_no = 1;
}

message GetStakeDistributionRequest {
  uint32 epoch_no = 1;
}

// Mirrors StakePoolEntry (candidates_data_source/db_model.rs:190).
message StakePoolEntry {
  bytes pool_hash = 1;   // 28 bytes (pool_hash.hash_raw)
  uint64 stake = 2;      // lovelace, summed per pool
}

message GetLatestTokenOutputForEpochRequest {
  AssetId asset = 1;     // exact (policy, name)
  uint32 epoch_no = 2;   // origin block epoch_no <= this (inclusive)
}

// Mirrors TokenTxOutput (candidates_data_source/db_model.rs:196).
message TokenTxOutput {
  bytes origin_tx_hash = 1;   // 32 bytes
  uint32 utxo_index = 2;      // TxIndex(u16)
  uint32 tx_epoch_no = 3;
  uint32 tx_block_no = 4;
  uint64 tx_slot_no = 5;
  uint32 tx_block_index = 6;  // TxIndexInBlock
  optional Datum datum = 7;   // LEFT JOIN; strict decode in Rust
}

message GetLatestTokenOutputForEpochResponse {
  optional TokenTxOutput output = 1;
}

message GetEpochNonceRequest {
  uint32 epoch_no = 1;
}

// Mirrors MainchainEpochNonce (candidates_data_source/db_model.rs:208).
message GetEpochNonceResponse {
  optional bytes nonce = 1;   // 32 bytes when present
}

message GetUnspentOutputsAtAddressRequest {
  string address = 1;    // committee candidate validator address (text equality)
  uint32 block_no = 2;   // created at <= block_no, not consumed at <= block_no
}

// Mirrors MainchainTxOutputRow / MainchainTxOutput
// (candidates_data_source/db_model.rs:142,176).
message AddressOutputRow {
  bytes utxo_tx_hash = 1;          // utxo_id_tx_hash
  uint32 utxo_index = 2;           // utxo_id_index: TxIndex(u16)
  uint32 tx_block_no = 3;
  uint64 tx_slot_no = 4;
  uint32 tx_epoch_no = 5;
  uint32 tx_index_in_block = 6;
  string address = 7;              // tx_out.address text
  optional Datum datum = 8;        // LEFT JOIN; DbDatumIfValid in Rust
  // Inputs of the creating transaction, ordered by (tx_hash bytes ASC,
  // index ASC). The SQL emits them as "hex#index" strings that Rust parses
  // with UtxoId::from_str.
  repeated OutputRef tx_inputs = 9;
}

// =========================================================================
// cNIGHT observation
// =========================================================================

message GetMappingRegistrationsRequest {
  string mapping_validator_address = 1;   // text equality
  // Auth token: policy = mapping validator script hash, name = auth token
  // asset name (cnight_observation.rs:132-138). Rows require quantity = 1.
  AssetId auth_token = 2;
  PositionWindow window = 3;              // creating tx position
  uint32 limit = 4;
  uint32 offset = 5;
}

// Mirrors RegistrationRow (MF/db/types.rs:116).
message RegistrationRow {
  Datum datum = 1;                        // always set (INNER JOIN); DbDatumIfValid in Rust
  uint32 block_no = 2;
  bytes block_hash = 3;
  // Rust ends with CardanoPosition.block_timestamp in ms
  // (TimestampUnixMillis(i64)); always a multiple of 1000 (SPEC 4.time).
  int64 block_time_unix_millis = 4;
  uint32 tx_index = 5;
  bytes tx_hash = 6;
  uint32 utxo_index = 7;
}

message GetMappingDeregistrationsRequest {
  string mapping_validator_address = 1;   // text equality
  PositionWindow window = 2;              // spending tx position
  uint32 limit = 3;
  uint32 offset = 4;
}

// Mirrors DeregistrationRow (MF/db/types.rs:128).
message DeregistrationRow {
  Datum datum = 1;                        // always set (INNER JOIN); DbDatumIfValid in Rust
  uint32 block_no = 2;                    // spending block
  bytes block_hash = 3;
  int64 block_time_unix_millis = 4;
  uint32 tx_index = 5;                    // spending tx index in block
  bytes tx_hash = 6;                      // spending tx hash
  bytes utxo_tx_hash = 7;                 // spent output's tx hash
  uint32 utxo_index = 8;                  // spent output's index
}

message GetAssetCreatesRequest {
  AssetId asset = 1;                      // cNIGHT (policy, name)
  PositionWindow window = 2;              // creating tx position
  uint32 limit = 3;
  uint32 offset = 4;
}

// Mirrors AssetCreateRow (MF/db/types.rs:141).
message AssetCreateRow {
  uint32 block_no = 1;
  bytes block_hash = 2;
  int64 block_time_unix_millis = 3;
  uint32 tx_index = 4;
  // Rust field is i64 (SQL ::BIGINT cast). Client fails if > i64::MAX.
  uint64 quantity = 5;
  string holder_address = 6;              // tx_out.address text
  bytes tx_hash = 7;
  uint32 utxo_index = 8;
}

message GetAssetSpendsRequest {
  AssetId asset = 1;                      // cNIGHT (policy, name)
  PositionWindow window = 2;              // spending tx position
  uint32 limit = 3;
  uint32 offset = 4;
}

// Mirrors AssetSpendRow (MF/db/types.rs:153).
message AssetSpendRow {
  uint32 block_no = 1;                    // spending block
  bytes block_hash = 2;
  int64 block_time_unix_millis = 3;
  uint32 tx_index = 4;                    // spending tx index in block
  uint64 quantity = 5;                    // spent output's quantity; i64 in Rust
  string holder_address = 6;              // spent output's address text
  bytes utxo_tx_hash = 7;
  uint32 utxo_index = 8;
  bytes spending_tx_hash = 9;
}

message GetMaxTxSizeRequest {
  uint32 block_no = 1;
}

message GetMaxTxSizeResponse {
  // Bytes. Rust type Option<i64>.
  optional uint64 max_tx_size = 1;
}

// =========================================================================
// Federated authority observation
// =========================================================================

message GetLatestGovernanceOutputRequest {
  string address = 1;     // council or technical committee address (text equality)
  bytes policy_id = 2;    // 28 bytes; any asset name of this policy matches
  uint32 block_no = 3;    // created at block_no <= this (inclusive)
}

// Mirrors GovernanceBodyUtxoRow (MF/db/types.rs:173).
message GovernanceOutput {
  Datum datum = 1;        // always set (INNER JOIN); strict DbDatum in Rust
  uint32 block_no = 2;
  bytes block_hash = 3;
  uint32 tx_index = 4;
  bytes tx_hash = 5;
  uint32 utxo_index = 6;
}

message GetLatestGovernanceOutputResponse {
  optional GovernanceOutput output = 1;
}
