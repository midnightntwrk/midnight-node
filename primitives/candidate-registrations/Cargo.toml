[package]
name = "midnight-primitives-candidate-registrations"
version = "0.1.0"
edition = "2024"
description = "Types shared by the node and the runtime for observing permissionless candidate registrations on Cardano"
license-file.workspace = true

[dependencies]
frame-support.workspace = true
sp-api.workspace = true
sp-core.workspace = true
sp-inherents.workspace = true
sp-runtime.workspace = true
parity-scale-codec.workspace = true
scale-info.workspace = true
serde = { workspace = true }
serde_valid = { workspace = true, optional = true }
hex = { workspace = true, features = ["serde"] }
thiserror = { workspace = true, optional = true }
sidechain-domain.workspace = true

[dev-dependencies]
hex-literal.workspace = true

[features]
default = ["std"]
std = [
    "frame-support/std",
    "hex/std",
    "parity-scale-codec/std",
    "scale-info/std",
    "serde/std",
    "serde_valid",
    "sidechain-domain/std",
    "sp-api/std",
    "sp-core/std",
    "sp-inherents/std",
    "sp-runtime/std",
    "thiserror",
]
