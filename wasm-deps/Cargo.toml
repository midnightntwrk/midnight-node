# @generated by scripts/buck2/gen-wasm-deps.sh — the no_std crate universe
# (crates_wasm) for the WASM runtime. Standalone [workspace] so Cargo resolves
# features independently from the std members. Regenerate via the .sh wrapper.
[package]
name = "wasm-deps-resolver"
version = "0.0.0"
edition = "2024"
publish = false

# resolver = "2" decouples host (build-script + proc-macro) feature unification
# from normal deps. Without it a workspace defaults to resolver "1" (regardless
# of edition), which unifies e.g. `either/std` pulled by a host proc-macro chain
# (aquamarine -> itertools -> either/std) into the wasm/target build of `either`,
# dragging `std` onto wasm32. Resolver 2 keeps the target build no_std.
[workspace]
resolver = "2"

[lib]
path = "src/lib.rs"

[dependencies]
async-trait = { version = "^0.1.89", default-features = false }
binary-merkle-tree = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2603", default-features = false }
blake2b_simd = { version = "^1.0.2", default-features = false }
derive-new = { version = "^0.7.0", default-features = false }
derive-where = { version = "^1.5.0", default-features = false }
derive_more = { version = "^2.1.1", features = ["from", "from_str", "into"], default-features = false }
ed25519-zebra = { version = "^4.2.0", default-features = false }
frame-executive = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2603", default-features = false }
frame-support = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2603", features = ["experimental"], default-features = false }
